name: rust-doctor

# Code-health gate: runs rust-doctor (clippy + cargo-audit/deny/geiger + custom AST rules folded
# into one 0–100 score), pinned to the latest stable release (0.2.0). The same tool runs locally
# via `scripts/doctor.sh`.
#
# We invoke the CLI directly rather than the official `arthjean/rust-doctor` composite action,
# because that action's v0.2.0 action.yml currently fails to parse on the runner. A prebuilt binary is
# downloaded from the release (no source build); rust-doctor still shells out to the runner's `cargo clippy`.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a tag on this scan. A tag ref matches neither trigger above, so
  # without this the release would be relying on a run that happened on a different ref (REL-1, #34).
  workflow_call:
    inputs:
      gate_semver:
        description: >-
          Fail the run when the public API has broken without a version that permits it. release.yml passes
          true; the push/PR triggers leave it false, which reports the same finding without failing (CI-2,
          #122 — the argument is in scripts/semver-check.sh). An explicit input rather than sniffing
          github.ref: in a called workflow github.event_name is the CALLER's, so a tag push and a branch
          push are not distinguishable from inside without guessing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # `security-events: write` is NOT here: it is granted on the `health` job alone, which is the only one
  # that uploads SARIF (CI-5, #150). At workflow level it would also be handed to `semver`, which needs
  # nothing but `contents: read`.

concurrency:
  group: rust-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Health scan
    runs-on: ubuntu-latest
    # CI-10 (#172). 69 s observed (58–69 across four runs). The full argument for why every job carries one
    # of these, and how the numbers were derived, is at the `changes` job in tests.yml. The headroom here is
    # for a cold dependency cache: the `cargo clean -p` step below forces a full re-lint of the WORKSPACE
    # crates every run by design, so the only thing a warm cache ever saves is the dependency build.
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning; scoped to this job (CI-5, #150)

    # The workspace has ONE clippy.toml, at the root, and this is what makes rust-doctor read it
    # (LINT-2, #28). rust-doctor writes a temporary `<crate>/clippy.toml` into any member that lacks
    # one, and clippy stops at the first config it finds walking up — so without this the injected
    # file shadows ours and the accepted `syn` duplication fails the gate. Pointing clippy at a
    # directory skips the walk entirely. See clippy.toml for how that was established.
    env:
      CLIPPY_CONF_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-doctor shells out to `cargo clippy`, so the runner needs cargo + clippy.
      #
      # PINNED, deliberately (LINT-1, #18). The gate below fails on warnings, so an unpinned `stable`
      # would let a new pedantic lint in a future clippy break CI on code nobody touched — which is how
      # the earlier `--fail-on error` compromise came about in the first place. Pinning moves that from
      # a surprise into a scheduled bump: raise this number, fix what the new clippy finds, commit both
      # together. rust-doctor itself is already pinned (0.2.0, below and in scripts/doctor.sh).
      # No `toolchain:` input: this is the job the pin exists for, so it takes rust-toolchain.toml's
      # channel. That file is now the one place the number lives — scripts/doctor.sh and
      # toolchain-pin.yml read it from there too.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      # Formatting, on the SAME pinned toolchain as the lint below and for the same reason: rustfmt's
      # output moves between releases, so an unpinned formatter would reformat code nobody touched and
      # fail the build on it — the drift LINT-1 (#18) pinned clippy to avoid, reintroduced by the other
      # half of the toolchain.
      #
      # Runs before the scan because it is seconds against minutes, and because a misformatted diff is a
      # one-command fix (`cargo fmt`) that nobody should wait for a health scan to be told about. See
      # rustfmt.toml for where the two settings came from — both measured off this tree, not chosen.
      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy only re-lints what it rebuilds, so a warm cache makes this gate check ONLY the crates that
      # changed — a pre-existing warning in an untouched crate is silently absent from the report and
      # cannot fail the build. Observed directly across three runs: f35c6cc and ee8ecb2 reported findings
      # from mcp-server alone, and jdwp-client's three `clippy::panic` findings appeared only in 617cb0e,
      # the first commit that happened to touch that crate. "0 warnings" from an incremental lint means
      # "0 in the crates I rebuilt", which is not what a gate is for.
      #
      # Evicting just the workspace crates keeps every dependency artifact cached (the expensive part)
      # while forcing ours to be linted from scratch every run. `|| true` because there is nothing to
      # clean on the first run, before the target dir exists.
      - name: Force a full re-lint of the workspace crates
        shell: bash
        # `-p` takes the PACKAGE name, which is no longer the directory name for the client (REL-5): it is
        # `java-debugging-jdwp-client` on crates.io. `cargo clean -p` on a name no package has is not an
        # error — it cleans nothing and exits 0, and the `|| true` would have swallowed it regardless — so
        # this would have gone on "passing" while quietly leaving the client's artifacts in place, which is
        # the stale-cache case the step exists to prevent.
        run: cargo clean -p java-debugging-jdwp-client -p jdwp-mcp --target-dir target/rust-doctor || true

      # --fail-on warning gates the build on warnings as well as errors (exit 3). It used to gate on
      # errors only, because there was a backlog of pedantic-clippy warnings to work through; that
      # backlog was cleared in 7253499 and then drifted back to 7 over 24 commits, because nothing
      # enforced it and the regression was mistaken for pre-existing debt. Zero is only zero if
      # something checks. See ADR-0007 and #18.
      #
      # SARIF is written to the file either way and uploaded below (`if: always()`), so a failing gate
      # still publishes the findings to code scanning rather than hiding them.
      # Fetched from the upstream GitHub release rather than npm (BUILD-1, #66): the npm package was
      # *unpublished* on 2026-07-29, so `npx -y rust-doctor@0.2.0` began failing with ETARGET and this gate
      # could not run at all while nothing in the repo had changed. Same version, same binary, a source that
      # takes a deliberate act to remove. `scripts/doctor.sh` fetches identically, so local and CI agree.
      - name: Fetch rust-doctor
        run: |
          curl -fsSL -o /tmp/rd.tar.gz \
            "https://github.com/arthjean/rust-doctor/releases/download/v0.2.0/rust-doctor-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/rd.tar.gz -C /tmp
          /tmp/rust-doctor --version

      # Two of rust-doctor's passes need a tool it does not carry, and until now the gate ran without
      # either — reporting `skipped-pass`, which reads exactly like a pass that found nothing. Prebuilt
      # binaries, so this costs seconds rather than the minutes `cargo install` would.
      #
      # `cargo-machete` earned its place immediately: it found `anyhow` and `serde_json` declared and never
      # used by `jdwp-client`, which had been paying for two dependencies for nothing.
      #
      # `cargo-deny` means an advisory published against a dependency can turn this gate red on a day
      # nothing in the repo changed. That is the point of it, and is why it belongs in the gate rather than
      # in a nightly nobody reads — but it is the one entry here that can fail a build you did not cause.
      #
      # THREE PASSES STAY UNRUN ON PURPOSE, and each `skipped-pass` note below is this decision, not an
      # oversight:
      #   - cargo-geiger — feeds `unsafe-dependency`, which rust-doctor.toml ignores at length: 21 warnings
      #     counting `unsafe` inside tokio/syn/serde, none of which anyone will replace. Installing it would
      #     spend build minutes producing findings we have already decided not to act on.
      #   - cargo-semver-checks — its baseline is the crate's latest crates.io RELEASE, which is the wrong
      #     comparison here even now that we publish (REL-5, ADR-0043): between releases the newest
      #     published version just is the previous tag, so the pass either repeats what the `semver` job
      #     below already does or, on a commit whose version is not yet published, answers about nothing.
      #     It was worse before the rename — `jdwp-client` on crates.io is bonk-dev/jdwp-client, an
      #     unrelated project holding the name, so the pass compared against a stranger's crate and
      #     reported "no semver update required", a confident answer built on the wrong package.
      #     rust-doctor's pass cannot be told to use a different baseline, so the check
      #     it would have done is the `semver` job at the bottom of this file instead, against the last
      #     release TAG: 196 checks run that way, against 0 through this pass.
      #   - coverage — `coverage.yml` owns it, produces `target/coverage/lcov.info`, and knows about the
      #     atexit-handler trap TEST-5 found. Generating coverage again here would double the test run to
      #     tell doctor something another workflow already publishes.
      # cargo-shear and zizmor are the two entries here that are NOT for a rust-doctor pass — see their
      # steps below. Keeping every tool this job needs on this ONE `tool:` line is deliberate:
      # `scripts/doctor.sh` reads it with `head -1` to work out which passes the gate really has the tool
      # for, and a second install step would be invisible to it. Its comment says so at the line.
      - name: Install the tools the gate needs
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-deny,cargo-machete,cargo-shear,typos,zizmor

      - name: Run rust-doctor
        run: /tmp/rust-doctor --sarif --fail-on warning > rust-doctor.sarif

      # WHY A SECOND UNUSED-DEPENDENCY TOOL, when rust-doctor's `dependencies` pass already runs
      # cargo-machete. Because that pass cannot see the case this workspace is actually shaped for.
      #
      # Measured, on this tree, by adding one unused dependency in each position and running both:
      #
      #   unused dep in a member crate            machete: flags     shear: flags
      #   dep named only in a source comment      machete: flags     shear: flags
      #   unused [workspace.dependencies] entry   machete: SILENT    shear: flags
      #
      # That last row is the one that matters here. Both members take their dependencies through
      # `<name>.workspace = true`, so the day the last member stops using one, the entry in the root
      # `[workspace.dependencies]` becomes dead weight that machete will never report — it checks
      # what a *package* declares against what that package's sources use, and a workspace table is
      # neither. (The middle row was a guess that turned out wrong: machete is not fooled by a
      # mention in a comment. It is not the naive regex its reputation suggests.)
      #
      # It runs as its own step rather than replacing machete because the tool is rust-doctor's
      # choice, not ours: the `dependencies` pass invokes cargo-machete and takes no option to swap
      # it. This is the same shape as the `semver` job at the bottom of this file — rust-doctor's
      # pass could not be pointed at the right baseline, so the check it would have done lives
      # beside it instead of inside it. Keeping machete costs nothing (0.06 s) and keeps doctor's
      # own pass honest rather than reporting `skipped-pass`.
      #
      # `if: always()` so a clippy finding above cannot hide a dependency finding here. Exit 1 on a
      # finding, 0 when clean, both verified — so this gates.
      - name: Unused dependencies the doctor pass cannot see (cargo-shear)
        if: always()
        run: cargo shear

      # WHY RUSTDOC IS A STEP AND NOT A rust-doctor PASS. The same shape as cargo-shear above and the
      # `semver` job below: rust-doctor has no rustdoc pass and takes no option to add one, so the check
      # lives beside it rather than inside it.
      #
      # It earns its place in THIS repo specifically. `rustfmt.toml` is configured not to reflow comments
      # so the narrative doc comments can be written long (LINT-4, #44), and there are ~12,200 `///` and
      # `//!` lines across the workspace. The prose is a primary artefact here, and until DOC-13 (#143)
      # nothing checked whether any of it rendered — not this workflow, not tests.yml, not doctor.sh.
      #
      # It was RED when it was added: 85 findings. 74 were one cause — `JdwpError` linked from modules
      # that do not import it, so every `# Errors` section rendered a literal `[JdwpError]` instead of a
      # link. The worst of the other 11 was an unbackticked `Arc<Mutex<Receiver>>`, which rustdoc parsed
      # as an HTML tag: the rendered page read "wrapped in an Arc which allows sharing", with the type
      # the sentence is about silently deleted from it. Prose that compiles and does not render is
      # exactly the class of silence this repo refuses to ship.
      #
      # `--document-private-items` because most of the narrative in `jdwp-client` hangs off private items;
      # without it this checks a small fraction of the prose it exists to protect. `if: always()` so a
      # finding in an earlier step cannot hide one here.
      - name: Check the documentation renders (rustdoc)
        if: always()
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

      # WHY cargo-deny RUNS AGAIN when rust-doctor already has a `dependencies (cargo-deny)` pass.
      # Because that pass does not check licences, and until CI-3 (#148) nothing did — cargo-deny ships
      # `[licenses] allow = []`, so without a deny.toml the check rejects the whole graph, MIT included
      # (98 crates, exit 4). A check nobody can run is a check nobody runs, which is why its absence
      # looked like a pass. deny.toml is what makes it answerable; this step is what makes it gate.
      #
      # `cargo deny check` runs all four. advisories, bans and sources already passed on defaults and
      # still do, so the new coverage is licences — and running the other three here costs ~0.1 s and
      # keeps one command as the answer to "what is the dependency policy".
      #
      # Advisories are owned by cargo-deny and not cargo-audit, deliberately: both read RUSTSEC, and
      # the install list above deliberately carries only cargo-deny, so an exception is written once in
      # deny.toml rather than twice in two tools' configs.
      #
      # `if: always()` for the same reason as the two steps above.
      - name: Dependency policy (cargo-deny)
        if: always()
        run: cargo deny check

      # DOC-14 (#144). Nothing spellchecked ~896 KB of prose, and some of that prose is the tool
      # descriptions and argument schemas that ship to callers — where a typo is not cosmetic, because
      # docs/toolkit-contract.md makes a caller-visible wording change the dangerous category.
      #
      # BE HONEST ABOUT WHAT THIS BOUGHT ON DAY ONE: nothing. The first run found 70 findings and all 70
      # were false positives — see _typos.toml, which carries the breakdown and a reason per entry. This
      # gate is a bet on the next typo, not a fix for the current ones, and if it ever reports a long
      # list again the right response is to read them rather than widen the allowlist.
      #
      # `typos` is the taiki-e/install-action name; the crate is `typos-cli`. Added to the one `tool:`
      # line above rather than as a second install step, because scripts/doctor.sh reads only the first
      # one (`head -1`) and the comment there explains at length why.
      #
      # `if: always()` for the same reason as the steps above.
      - name: Spellcheck the prose (typos)
        if: always()
        run: typos

      # CI-5 (#150). Nothing linted the workflows, and the first run of zizmor found 71 findings: 32
      # unpinned action references, 9 `artipacked` (checkout leaving credentials in the runner's git
      # config), a workflow-level `security-events: write` that only one job needed, and a handful of
      # `${{ }}` expansions inside `run:` blocks. All of them are fixed rather than suppressed, except
      # one — the GITHUB_ENV write in .github/actions/setup-rust, which is what that step IS, and which
      # carries its reason at the line.
      #
      # It gates because it is green: adding a linter that reports 71 findings and gates on none of them
      # is the permanent-red-or-meaningless-green shape this repo keeps writing post-mortems about. If a
      # future finding is genuinely acceptable, annotate it AT THE LINE with why — a `# zizmor: ignore[…]`
      # with no reason is how this turns into a file for silencing the tool.
      #
      # INSTALLED ABOVE, NOT RUN THROUGH `uvx`, AND THE HISTORY IS THE WARNING. This step originally read
      # `uvx zizmor …` on the reasoning that zizmor is a Python tool needing no install step. Both halves
      # were wrong: zizmor is `zizmorcore/zizmor`, a Rust project that publishes prebuilt binaries, and
      # GitHub's runners do not ship `uvx` — so the step exited **127, command not found**, on every run
      # from the moment it was added. It never linted anything and it never passed.
      #
      # It went unnoticed because it landed during a GitHub Actions outage: no workflow ran for eight
      # hours, so the red arrived long after the commit that caused it, and `scripts/doctor.sh` reported
      # "would pass" locally because `uvx` IS commonly installed on a dev box. A tool that is downloaded
      # on demand locally and absent in CI is the one shape where a local gate and the real gate can
      # disagree silently — which is why it now comes from the same pinned install step as every other
      # tool here, and `doctor.sh` prefers the same binary.
      #
      # `--persona=regular` is the default posture. `--pedantic` adds findings this repo would suppress
      # in bulk, which is the opposite of the point.
      - name: Lint the workflows (zizmor)
        if: always()
        run: zizmor --persona=regular .github/

      # CI-9 (#166). zizmor audits what a workflow is ALLOWED TO DO; nothing checked whether one MEANS WHAT
      # IT SAYS. actionlint resolves `needs.<job>.outputs.<name>` against the outputs that job declares,
      # type-checks `${{ }}` expressions, and validates `runs-on`, `shell:` and the job schema. Same shape as
      # cargo-shear beside machete and the `semver` job beside the scan: the incumbent tool cannot be pointed
      # at this question.
      #
      # THE FAILURE IT COVERS HERE IS CI-6's (#151). `needs.changes.outputs.rust == 'true'` appears four
      # times in tests.yml, and a typo in the output name — or a rename in the `changes` job without
      # updating its readers — evaluates to the empty string, every leg skips, and `ci-ok` reports green,
      # because `ci-ok` has no `if:` and is designed to report on exactly the pushes where the legs skip.
      # Verified rather than assumed: planting `outputs.rusty` produces four
      # `property "rusty" is not defined in object type {rust: string}` findings and exit 1. The same run
      # caught a planted `timeout-minutes:` on a `uses:` job, which is why the two gate jobs in release.yml
      # carry a comment instead of a budget (CI-10, #172).
      #
      # FIRST-RUN COUNT: 0. Nothing in `.github/` was wrong. That is the result, it is in the commit message,
      # and this gate is a bet on the next rename rather than a fix for a current defect.
      #
      # NOT INSTALLED THROUGH THE `tool:` LINE ABOVE, because taiki-e/install-action does not carry
      # actionlint (it carries shellcheck, typos and zizmor; checked against its manifest list). Curled from
      # the pinned upstream release instead, the same way rust-doctor itself is fetched a few steps up and
      # for the same reason BUILD-1 (#66) moved that one off npm. Its absence from that `tool:` line is
      # harmless to `scripts/doctor.sh`, which reads the line only to answer "does the SCAN have this
      # cargo-* tool" — actionlint backs no rust-doctor pass.
      - name: Fetch actionlint
        if: always()
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version

      # `-shellcheck=` AND `-pyflakes=` TURN OFF INTEGRATIONS THAT ARE ON BY DEFAULT, and this is the one
      # decision in the step worth arguing with, so here is the measurement behind it.
      #
      # actionlint shells out to shellcheck for every `run:` block when shellcheck is on PATH — and GitHub's
      # runner images ship it. Measured on this tree with shellcheck 0.11.0: 3 findings, all from shellcheck
      # (one SC2010 in release.yml's dist/ guard, two SC2129 style notes in toolchain-pin.yml) and none of
      # them a workflow-semantics finding. The problem is not the three, it is the version: the runner's
      # shellcheck is not pinned by anything here, so a gate that consulted it would move under untouched
      # workflows on an image bump — the drift LINT-1 (#18) pinned clippy to avoid. And a dev box may have
      # no shellcheck at all (this one does not), so `scripts/doctor.sh` would print "would pass" over
      # findings CI has, which is precisely how the uvx/zizmor disagreement went unnoticed for eight hours.
      #
      # Turning them on later means pinning shellcheck through the `tool:` line above AND teaching doctor.sh
      # to refuse a partial verdict when it is missing. Worth doing; not worth doing silently.
      - name: Lint the workflow semantics (actionlint)
        if: always()
        run: /tmp/actionlint -shellcheck= -pyflakes=

      # TEST-48 (#163). Four Python scripts decide what CI publishes — the release body, what reaches the
      # security tab, which tests run in which leg, and the timings file the sharding reads — and none of
      # them had a test, while `.githooks/test.sh` is a 22-case matrix and `scripts/guard.test.sh` a
      # 20-case one. The cost is on record: `release-notes.py` did not match the compound `fix(lint)+docs:`
      # subject, so 13 commits landed in PUBLISHED release notes with their type stripped, and it was the
      # commit-msg hook that found it rather than anything testing the script.
      #
      # Here rather than in tests.yml because this job is the one `scripts/doctor.sh` mirrors, and the
      # script runs the identical command so a clean local run stays a green gate. It needs no Rust and no
      # JDK — python3, git and the fixtures, all of which this job already has.
      #
      # `if: always()` for the same reason as the steps above.
      - name: Fixture matrix for the CI scripts
        if: always()
        run: bash scripts/tests/run.sh

      # A failing gate prints nothing useful: --sarif sends every finding to the file, so the step log
      # ends at "exit code 3" and the findings are only readable via the code-scanning API. Print them,
      # so the reason a build failed is in the build that failed.
      - name: Show the findings that failed the gate
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("rust-doctor.sarif") as f: s = json.load(f)
          rows = [(r.get("level","?"), r.get("ruleId","?"),
                   (r.get("locations") or [{}])[0].get("physicalLocation",{}).get("artifactLocation",{}).get("uri","?"),
                   (r.get("locations") or [{}])[0].get("physicalLocation",{}).get("region",{}).get("startLine","?"),
                   r.get("message",{}).get("text","")[:120])
                  for run in s.get("runs",[]) for r in run.get("results",[])
                  if r.get("level") in ("warning","error")]
          print("## rust-doctor gate failed —", len(rows), "warning/error finding(s)\n")
          for lvl, rule, path, line, msg in rows:
              print(f"- **{lvl}** `{rule}` — `{path}:{line}`\n  {msg}")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      # The raw SARIF is not uploadable as-is, and the security tab is where that went unnoticed: it had
      # accumulated 115 open alerts against a green gate, every one of them pointing at a path that is not
      # in this tree (`src/handlers.rs` — rust-doctor writes crate-relative URIs under a `%SRCROOT%` base
      # id it never declares, and this is a workspace) and none of them at a level that fails anything.
      # The script resolves the paths and publishes only what the gate acts on; its stdout accounts for
      # every result it withheld, so a quiet tab is not the same as an unexamined one.
      - name: Prepare the SARIF for code scanning
        if: always()
        shell: bash
        run: |
          scripts/sarif-for-code-scanning.py rust-doctor.sarif rust-doctor-published.sarif \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # codeql-bundle-v2.26.2
        with:
          sarif_file: rust-doctor-published.sarif
          category: rust-doctor

      - name: Upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-doctor-sarif
          path: rust-doctor.sarif
          if-no-files-found: warn

  # Its own job, not a step in the scan above, for one reason: it needs the FULL history and every tag, and
  # the health scan does not. A shallow checkout would leave it with no baseline — which it reports rather
  # than passing quietly, but a check whose default state is "could not run" is not a check.
  #
  # It runs `cargo semver-checks --baseline-rev <last tag>` and NOT the bare `cargo semver-checks` that
  # rust-doctor's own semver pass would: the default baseline is the crate's latest crates.io RELEASE,
  # which cannot answer for a commit between releases — the case this job runs on. Before REL-5 it was
  # wrong in a louder way, comparing against bonk-dev/jdwp-client, an unrelated project that held the name
  # our library has since been renamed away from. See
  # scripts/semver-check.sh for the whole argument, and for what this covers (jdwp-client's lib API —
  # jdwp-mcp is a [[bin]] and contributes nothing) versus what it cannot (the MCP tool surface, which is
  # what callers actually pin, and which only docs/toolkit-contract.md covers).
  #
  # IT GATES ON THE RELEASE PATH ONLY, and that is a change (CI-2, #122). release.yml passes
  # `gate_semver: true`, so a violation still blocks a tag — which is the point: the version number is what
  # the downstream toolkit pins, and it should not be able to claim compatibility the API does not have. On
  # a push to main or a PR the same finding is printed in full, with the bump that would permit it, and the
  # run concludes green.
  #
  # Why: between releases the working version EQUALS the baseline tag, so any break violates the smallest
  # bump and this job was red for the whole of every cycle — measured as the only failing job in every run
  # between two consecutive releases. The only way to clear it was to cut the release. `CLAUDE.md` names
  # that cost where it explains why the AI review workflow was removed rather than repaired: a permanent red
  # that tested nothing teaches you to ignore red on PRs. scripts/semver-check.sh's header carries the
  # argument and the rejected alternative (computing the bump the next release would take, and passing on
  # that — rejected for encoding a guess about a version nobody has chosen).
  #
  # On a release commit every check skips (a major bump permits breaking changes) and the script says so, so
  # the pass is announced as vacuous instead of counted as verification. That is unchanged.
  semver:
    name: Public API vs the last tag
    runs-on: ubuntu-latest
    # 33 s observed (21–33), and that figure is ALREADY the cold one — this job passes `cache: "false"`, so
    # there is no warm case to be surprised by. The headroom is for cargo-semver-checks building rustdoc
    # JSON twice, for the baseline tag and for HEAD. See tests.yml's `changes` job for the general argument.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and history: the baseline is a tag, not a registry

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # No `toolchain:` — the same pin the health scan uses, for the same reason, now from one file.
          cache: "false"

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-semver-checks

      - name: Compare the public API against the last release tag
        shell: bash
        run: |
          # `shell: bash` already runs with -eo pipefail, so the script's exit status survives the pipe into
          # the summary. Set explicitly and said out loud because it nearly did not: a local negative test
          # printed "exit=0" while the check had in fact failed, because `$?` after a pipeline is `tee`'s.
          set -o pipefail
          # Spelled out in bash rather than as GitHub's and-or ternary idiom, for two reasons and the
          # second one broke this file once. FIRST: in that idiom an empty string is falsy, so the natural
          # `inputs.gate_semver && '' || '--report-only'` silently passes --report-only in BOTH directions
          # and would ungate the release. SECOND: an expression written in a COMMENT is still an
          # expression — GitHub interpolates the whole `run:` body before the shell ever sees it, so a
          # worked example naming a context that does not exist is a workflow-file parse error, and the
          # run fails with zero jobs and no annotation on any step. That is how the commit introducing
          # this input failed: the comment warning about the idiom contained the idiom.
          #
          # `inputs` is an empty context on the push/PR triggers, so an unset value compares unequal to
          # "true" and reports rather than gates — the safe way round for the branch that is not the tag.
          args=()
          if [ "${{ inputs.gate_semver }}" != "true" ]; then args+=(--report-only); fi
          scripts/semver-check.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
