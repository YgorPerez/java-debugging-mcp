name: rust-doctor

# Code-health gate: runs rust-doctor (clippy + cargo-audit/deny/geiger + custom AST rules folded
# into one 0–100 score), pinned to the latest stable release (0.2.0). The same tool runs locally
# via `scripts/doctor.sh`.
#
# We invoke the CLI directly rather than the official `arthjean/rust-doctor` composite action,
# because that action's v0.2.0 action.yml currently fails to parse on the runner. `npx` fetches a
# prebuilt binary (no source build); rust-doctor still shells out to the runner's `cargo clippy`.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a tag on this scan. A tag ref matches neither trigger above, so
  # without this the release would be relying on a run that happened on a different ref (REL-1, #34).
  workflow_call:

permissions:
  contents: read
  security-events: write # upload SARIF to GitHub code scanning

concurrency:
  group: rust-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Health scan
    runs-on: ubuntu-latest

    # The workspace has ONE clippy.toml, at the root, and this is what makes rust-doctor read it
    # (LINT-2, #28). rust-doctor writes a temporary `<crate>/clippy.toml` into any member that lacks
    # one, and clippy stops at the first config it finds walking up — so without this the injected
    # file shadows ours and the accepted `syn` duplication fails the gate. Pointing clippy at a
    # directory skips the walk entirely. See clippy.toml for how that was established.
    env:
      CLIPPY_CONF_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      # rust-doctor shells out to `cargo clippy`, so the runner needs cargo + clippy.
      #
      # PINNED, deliberately (LINT-1, #18). The gate below fails on warnings, so an unpinned `stable`
      # would let a new pedantic lint in a future clippy break CI on code nobody touched — which is how
      # the earlier `--fail-on error` compromise came about in the first place. Pinning moves that from
      # a surprise into a scheduled bump: raise this number, fix what the new clippy finds, commit both
      # together. rust-doctor itself is already pinned (0.2.0, below and in scripts/doctor.sh).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      # Formatting, on the SAME pinned toolchain as the lint below and for the same reason: rustfmt's
      # output moves between releases, so an unpinned formatter would reformat code nobody touched and
      # fail the build on it — the drift LINT-1 (#18) pinned clippy to avoid, reintroduced by the other
      # half of the toolchain.
      #
      # Runs before the scan because it is seconds against minutes, and because a misformatted diff is a
      # one-command fix (`cargo fmt`) that nobody should wait for a health scan to be told about. See
      # rustfmt.toml for where the two settings came from — both measured off this tree, not chosen.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Clippy only re-lints what it rebuilds, so a warm cache makes this gate check ONLY the crates that
      # changed — a pre-existing warning in an untouched crate is silently absent from the report and
      # cannot fail the build. Observed directly across three runs: f35c6cc and ee8ecb2 reported findings
      # from mcp-server alone, and jdwp-client's three `clippy::panic` findings appeared only in 617cb0e,
      # the first commit that happened to touch that crate. "0 warnings" from an incremental lint means
      # "0 in the crates I rebuilt", which is not what a gate is for.
      #
      # Evicting just the workspace crates keeps every dependency artifact cached (the expensive part)
      # while forcing ours to be linted from scratch every run. `|| true` because there is nothing to
      # clean on the first run, before the target dir exists.
      - name: Force a full re-lint of the workspace crates
        shell: bash
        run: cargo clean -p jdwp-client -p jdwp-mcp --target-dir target/rust-doctor || true

      # --fail-on warning gates the build on warnings as well as errors (exit 3). It used to gate on
      # errors only, because there was a backlog of pedantic-clippy warnings to work through; that
      # backlog was cleared in 7253499 and then drifted back to 7 over 24 commits, because nothing
      # enforced it and the regression was mistaken for pre-existing debt. Zero is only zero if
      # something checks. See ADR-0007 and #18.
      #
      # SARIF is written to the file either way and uploaded below (`if: always()`), so a failing gate
      # still publishes the findings to code scanning rather than hiding them.
      - name: Run rust-doctor
        run: npx -y rust-doctor@0.2.0 --sarif --fail-on warning > rust-doctor.sarif

      # A failing gate prints nothing useful: --sarif sends every finding to the file, so the step log
      # ends at "exit code 3" and the findings are only readable via the code-scanning API. Print them,
      # so the reason a build failed is in the build that failed.
      - name: Show the findings that failed the gate
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("rust-doctor.sarif") as f: s = json.load(f)
          rows = [(r.get("level","?"), r.get("ruleId","?"),
                   (r.get("locations") or [{}])[0].get("physicalLocation",{}).get("artifactLocation",{}).get("uri","?"),
                   (r.get("locations") or [{}])[0].get("physicalLocation",{}).get("region",{}).get("startLine","?"),
                   r.get("message",{}).get("text","")[:120])
                  for run in s.get("runs",[]) for r in run.get("results",[])
                  if r.get("level") in ("warning","error")]
          print("## rust-doctor gate failed —", len(rows), "warning/error finding(s)\n")
          for lvl, rule, path, line, msg in rows:
              print(f"- **{lvl}** `{rule}` — `{path}:{line}`\n  {msg}")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-doctor.sarif
          category: rust-doctor

      - name: Upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-doctor-sarif
          path: rust-doctor.sarif
          if-no-files-found: warn
