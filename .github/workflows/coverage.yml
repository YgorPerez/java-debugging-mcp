name: coverage

# Region/line coverage over BOTH layers — unit tests and the MCP-level integration tests — via
# scripts/coverage.sh, the same script run locally.
#
# This exists in CI because the local story is bad: `-C instrument-coverage` needs the profiler
# runtime, and rustup ships no `profiler_builtins` for `x86_64-pc-windows-gnu`, so a Windows dev box
# cannot produce a report at all (the msvc toolchain has the runtime but needs the Visual Studio C++
# build tools for link.exe). Linux has both, and a JDK for the probes. TEST-7 (#19) stalled on exactly
# that, so the measurement lives here instead of depending on who has the right machine.
#
# There is deliberately NO percentage gate — the standing decision in docs/coverage.md, and the reason is that
# a coverage percentage rises with tests that assert nothing. The job still FAILS when the suite fails
# or when nothing ran, because a report generated from a suite that did not execute is the failure mode
# TEST-5 found (llvm-cov flushes counters in an atexit handler that SIGKILL skips, so the whole
# integration suite once contributed nothing while `handlers.rs` measured 3.75%). coverage.sh keeps that
# guard: no .profraw files, or a SKIP line, and it refuses to report.
#
# Not run on every PR: an instrumented build plus ~47 JVM-launching tests is slow, and with no gate the
# per-PR signal would be noise nobody reads. Push-to-main gives the trend, and workflow_dispatch covers
# "I want the number now".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Region + line coverage
    runs-on: ubuntu-latest
    # CI-10 (#172). This was the ONE `timeout-minutes` in the whole repo, and it was a round 30 with no
    # derivation. 216 s observed (213–216), so the real shape is 3.6 minutes: an instrumented build plus the
    # entire unsharded `#[ignore]`d suite. 20 is that with room for a cold cache, and it is still five times
    # the measurement. See tests.yml's `changes` job for why every job now carries one of these.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # llvm-tools-preview carries llvm-profdata/llvm-cov, which cargo-llvm-cov shells out to.
      # Unpinned `stable` on purpose, unlike rust-doctor.yml: that one is pinned because it gates on
      # warnings and a new clippy lint would break untouched code. Nothing here gates on a number, so a
      # toolchain bump can only change the figure, which is the thing we want current anyway.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # Explicit, because rust-toolchain.toml pins the gate's toolchain and would otherwise govern here.
          toolchain: stable
          components: llvm-tools-preview

      # Prebuilt binary — `cargo install cargo-llvm-cov` from source costs several minutes.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov

      # javac, not just a JRE: the harness compiles examples/probes/*.java at test time. Without it every
      # integration test SKIPs and coverage.sh fails rather than reporting a plausible low number.
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # `shell: bash` for pipefail — see the note in tests.yml. Without it a failing suite would exit
      # into `tee` and leave this step green.
      - name: Run coverage (unit + integration)
        shell: bash
        run: scripts/coverage.sh --uncovered 2>&1 | tee coverage.log

      # The summary is the point of the run, so put it where it is read without opening logs.
      - name: Publish the summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Coverage — unit + integration'
            echo ''
            echo 'No percentage gate (see docs/coverage.md). The per-file region column is the list worth reading:'
            echo 'the branch nobody reaches is where the untested *states* hide.'
            echo ''
            echo '```'
            sed -n '/^Filename/,$p' coverage.log || cat coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov + logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            coverage.log
          if-no-files-found: warn
