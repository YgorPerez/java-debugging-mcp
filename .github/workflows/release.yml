name: release

# Builds `jdwp-mcp` for the platforms this project is actually used from and attaches the binaries to a
# GitHub release, so installing needs no Rust toolchain (REL-1, #34).
#
# The job order is the safety property, not a preference:
#   version -> {gate-tests, gate-lint, build, package} -> release -> publish
# `version` is toolchain-free and finishes in seconds, so a tag that disagrees with the manifest costs
# nothing and, more importantly, cannot reach a job that publishes. `release` waits on both gates.
#
# `publish` (crates.io, REL-5) is deliberately LAST, and that is the one ordering here chosen for
# reversibility rather than for speed. A GitHub release can be deleted and cut again; a crates.io version
# can only be YANKED, and a yanked version still occupies its number forever. So the recoverable publish
# goes first and the irreversible one goes last, which makes the bad case "crates.io is a release behind"
# — fixable by re-running this job — instead of "0.20.0 exists on crates.io and nowhere else".
#
# `package` is the other half of that argument: it is a full `cargo publish --dry-run` running in parallel
# with the binary matrix, and `release` waits on it. Packaging has its own failure modes that nothing else
# in this pipeline exercises — a missing `description`, an unpublishable path dependency, a version already
# taken — and every one of them is cheap before the tag is public and expensive after.
#
# The gates are CALLED here rather than assumed to have run: tests.yml and rust-doctor.yml trigger on
# push-to-main and pull_request, so a tag ref fires neither. Without this a tag placed on a commit that
# never faced them — or on a branch that never merged — would publish in silence.

on:
  push:
    # Deliberately loose: the `version` job below is the real check, and a tag that gets this far only to
    # be rejected there produces a visible failure, whereas a tag that misses a strict filter produces
    # nothing at all and looks like the workflow is broken.
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # NOT cancel-in-progress, unlike every other workflow here. Cancelling mid-upload leaves a published
  # release carrying a subset of its assets and a SHA256SUMS that lists files nobody can download; a
  # duplicate run is the cheaper failure.
  cancel-in-progress: false

jobs:
  version:
    name: Tag agrees with the manifest
    runs-on: ubuntu-latest
    # CI-10 (#172). 7 s observed (3–7). It is deliberately toolchain-free, which is what makes it cheap
    # enough to run before everything else — so this is the tightest budget in the repo and it is still
    # forty times the measurement. See tests.yml's `changes` job for the general argument and the sourcing.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # [workspace.package].version is the single source of truth and the tag is a claim about it. Read
      # the TOML directly rather than asking cargo: it keeps the first job free of a toolchain install,
      # which is what makes it cheap enough to run before everything else. tomllib is stdlib as of
      # Python 3.11 and the ubuntu runner image ships 3.12.
      - name: Compare the tag against [workspace.package].version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as f:
              manifest = tomllib.load(f)["workspace"]["package"]["version"]
          if tag != f"v{manifest}":
              print(f"::error::Tag {tag} does not match [workspace.package].version {manifest}. "
                    f"Either the tag should be v{manifest}, or Cargo.toml was never bumped. "
                    f"Nothing has been built or published.")
              sys.exit(1)
          print(f"{tag} matches [workspace.package].version = {manifest}")
          PY

  # Re-running the gates costs a few minutes and buys the guarantee the acceptance criteria ask for: the
  # release is bound to the gate's verdict for THIS commit, not to whatever happened to be green on main
  # when the tag was cut.
  # tests.yml is a JDK matrix as of TEST-11 (#36), so this one `needs:` now waits on every leg — 11, 17
  # and 21 — not on a single job. A called workflow succeeds only when all of its jobs do, and its
  # `fail-fast: false` only keeps the other legs running to report; it does not let a red leg through.
  #
  # NEITHER GATE JOB CARRIES A `timeout-minutes`, and that is the schema rather than an omission (CI-10,
  # #172): a job that calls a reusable workflow with `uses:` accepts only name/uses/with/secrets/needs/if/
  # permissions, and actionlint fails the file on anything else — verified by planting one. The budget for
  # this work lives on the jobs INSIDE tests.yml and rust-doctor.yml, which all have one, so a hung
  # integration leg is still killed in 20 minutes when it is reached through here.
  gate-tests:
    name: Gate (tests)
    needs: version
    uses: ./.github/workflows/tests.yml

  gate-lint:
    name: Gate (lint)
    needs: version
    uses: ./.github/workflows/rust-doctor.yml
    # THIS is the ref the semver check gates on (CI-2, #122). On a push to main or a PR the same job reports
    # a break and concludes green, because between releases the working version equals the baseline tag and
    # every break violates it — a red for the whole cycle that could only be cleared by cutting the release.
    # Here the release IS being cut, the version has been chosen, and a public API that outruns it must block
    # the tag: the version number is what the downstream toolkit pins.
    with:
      gate_semver: true
    # security-events: write is rust-doctor.yml's own requirement — it publishes its SARIF to code
    # scanning — and is granted to this job alone. The job that can write to the repository is `release`,
    # and it carries contents: write and nothing else.
    permissions:
      contents: read
      security-events: write

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    # 192 s observed for the slowest slice, windows-x86_64 (the range across all slices and two releases is
    # 93–192). Per-target caching means a release cut days after the last one usually finds its entry
    # expired, so treat the cold build as the normal case rather than the exception. See tests.yml's
    # `changes` job for the general argument.
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide whether the others would have built; with `needs` on the
      # release job a partial matrix still cannot publish.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # REL-9 (#173). ARM Linux had never been built, in any release, and the downstream toolkit had
          # already written the gap down: `jdwp-platforms` carries an "absent on purpose" section saying ARM
          # Linux gets the skills and no debugger. That is a consumer handling our gap gracefully, which is
          # the easiest kind of bug report to never see.
          #
          # NATIVE on GitHub's free `ubuntu-24.04-arm` runner, not `cross` and not cargo-zigbuild. This repo
          # is public so the runner is available, the workspace is pure Rust with nothing
          # architecture-specific in it, and a native build needs no emulation layer to reason about. Same
          # musl choice as the x86_64 slice for the same reason — see the note at the musl step below.
          #
          # `linux-aarch64` IS THE INTERFACE, not a label: docs/toolkit-contract.md makes the asset name part
          # of the contract, and it is what the toolkit's `jdwp-platforms` will name and what
          # `ensure-jdwp.sh` matches against SHA256SUMS. Renaming it later costs them a migration.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Both macOS slices are cross-compiled from the arm64 runner. macos-13 is the only Intel image
          # left and it is on a retirement clock; the Apple SDK on the arm64 image targets both
          # architectures, and the SUITE does not run at release time anyway — the gates above already ran
          # it. (Since REL-9 the artifact itself IS started and asked for its tool list, which is a
          # different claim; the Intel slice is the one output of this matrix its own builder cannot
          # execute, so it is the one skipped there. See that step.)
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `stable`, matching tests.yml and coverage.yml — NOT the pin in rust-toolchain.toml. That pin exists
      # for exactly one reason (#18): rust-doctor fails the build on clippy warnings, so a new lint in a
      # newer toolchain would break code nobody touched. This job runs no lint — the only thing it gates on
      # is whether the artifact it produces starts (REL-9, #173) — so a second pinned version number here
      # would buy no safety and add a second thing to remember to bump — the maintenance hazard LINT-2
      # (#28) is about.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # Explicit, because rust-toolchain.toml pins the gate's toolchain and would otherwise govern here — and
          # shipping release binaries built by an old pinned compiler is not what that pin is for.
          toolchain: stable
          targets: ${{ matrix.target }}
          # rust-cache keys on job and host, not on --target, so without this the two macOS slices share
          # the arm64 runner's cache entry and fight over it.
          cache-key: ${{ matrix.target }}

      # GLIBC: the Linux slice is static musl, not glibc, and that is a deliberate answer to where these
      # binaries run. This debugger attaches to Java app servers, which are routinely older than a GitHub
      # runner image; a glibc build carries a hard floor and dies on anything older with
      # `version 'GLIBC_2.xx' not found`. Choosing an older runner image only lowers that floor, and puts
      # the choice on a deprecation clock. musl removes the floor: crt-static is the default for this
      # target, so the result depends on the kernel and nothing else. The workspace is pure Rust down to
      # libc (serde/serde_json/tokio/tracing/bytes/schemars — no -sys crate in Cargo.lock), so there is
      # no C dependency to fight, and musl's slower allocator does not matter to a process that spends
      # its life blocked on a socket.
      #
      # rustc drives this target's link through the runner's `cc` using its own bundled crt objects, so a
      # pure-Rust build most likely needs nothing extra; musl-gcc is installed regardless because one apt
      # line is cheaper than finding out otherwise during a release.
      #
      # Matched on the SUFFIX rather than the full triple as of REL-9 (#173), so the aarch64 slice gets the
      # same treatment: a condition naming one triple would have silently skipped this on the new runner,
      # and "most likely needs nothing extra" is not a thing to find out during a release.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked: Cargo.lock is committed, and a release is the one build where resolving something newer
      # than what the gates just tested is unacceptable. -p jdwp-mcp keeps the examples and the client's
      # dev-dependencies out of a build whose only output is one binary.
      - name: Build jdwp-mcp
        run: cargo build --release --locked --target ${{ matrix.target }} -p jdwp-mcp

      # Named for the person downloading it. Every platform's binary is `jdwp-mcp` inside target/, which
      # collides the moment they land in one directory, and a target triple answers the question only if
      # you already know how to read one.
      - name: Name the artifact for a human
        shell: bash
        run: |
          asset="jdwp-mcp-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.ext }}"
          mv "target/${{ matrix.target }}/release/jdwp-mcp${{ matrix.ext }}" "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # REL-9 (#173) asks for the new platform to be verified BY RUNNING THE BINARY, not by the build
      # exiting 0, and that criterion is right for every slice rather than just the new one: the gates
      # above test the CODE, on one host, and have never once executed the artifact this job is about to
      # publish. A binary that compiles and cannot start is a release nobody can install, found by the
      # person installing it.
      #
      # It runs BEFORE the upload, so a binary that cannot start is never attached to anything.
      #
      # THE CHECK IS DELIBERATELY THE SMALLEST REAL ONE. `jdwp-mcp` needs no JVM to answer its own front
      # door: initialize, the initialized notification, then `tools/list` over stdio, and the process exits
      # when stdin closes. That exercises the binary's startup, its runtime and its stdio loop without
      # bringing a JDK to a job whose whole point is that it gates on nothing else.
      #
      # `x86_64-apple-darwin` IS THE ONE SLICE THAT CANNOT DO THIS, and it is skipped by name rather than
      # left to fail: both macOS slices cross-compile from the arm64 runner, and that runner has no Rosetta,
      # so the Intel binary is the only output of this matrix that its own builder cannot execute. Verified
      # locally for the aarch64 Linux slice ahead of the first tag, since it had never been built: the
      # static ARM64 binary answers `initialize` and lists all 40 tools under qemu-aarch64.
      - name: Prove the binary starts and answers tools/list
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' |
            "./$ASSET" > smoke.jsonl
          if ! grep -q '"serverInfo"' smoke.jsonl; then
            echo "::error::$ASSET started but never answered initialize — it would be unusable as an MCP server."
            cat smoke.jsonl
            exit 1
          fi
          if ! grep -q '"debug.attach"' smoke.jsonl; then
            echo "::error::$ASSET answered initialize but tools/list carried no debug.attach — the tool surface is missing."
            cat smoke.jsonl
            exit 1
          fi
          echo "$ASSET answered tools/list with $(grep -o '"name":"debug\.[a-z_]*"' smoke.jsonl | wc -l) tools"
          rm -f smoke.jsonl

      # The artifact is named after the FILE it carries, not after the matrix slice, so that one glob —
      # `jdwp-mcp-*` — selects this job's output at every stage: the download below, the checksum, the
      # upload. Naming it `${{ matrix.name }}` (`linux-x86_64`) meant the download had no way to say
      # "mine" without listing the slices, which is how REL-2 (#41) happened.
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Everything the real publish does except the upload, so a packaging failure is found while the only cost
  # of failing is a red run. `--dry-run` builds each crate from the tarball it would actually send, which is
  # what catches the class of break that only exists inside a `.crate`: a source file cargo declines to copy,
  # a dependency that resolves locally through `path` and has no `version` for a stranger to resolve, a
  # required manifest field left empty.
  #
  # It does NOT catch a version already on crates.io — `--dry-run` skips that check. The publish job is
  # where that surfaces, and it is why `release.sh` refuses to reuse a tag.
  package:
    name: Crates package cleanly
    needs: version
    runs-on: ubuntu-latest
    # 62 s observed, from the one release that has run this job (v0.20.0, REL-5). It is cold by
    # construction: `cargo publish --dry-run` builds each crate from the tarball it would send, in a temp
    # directory the cargo cache does not reach.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # `stable`, for the same reason the build matrix says so at its own call site: rust-toolchain.toml
          # pins the GATE's compiler, and what is published should build on current Rust rather than on
          # whatever version the lint pin happens to sit at.
          toolchain: stable

      # --workspace publishes both members and works out the order itself: `java-debugging-jdwp-client`
      # cannot go second, because `jdwp-mcp` names it as a dependency. Doing that ordering by hand is a
      # second copy of a fact cargo already knows.
      #
      # Twelve `warning: ignoring example ... is not included in the published package` lines are EXPECTED
      # here — jdwp-client declares example targets under `../examples/`, outside its own package root, and
      # they are deliberately not shipped. jdwp-client/Cargo.toml carries the full reason.
      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked

  release:
    name: Publish the release
    needs: [version, gate-tests, gate-lint, build, package]
    runs-on: ubuntu-latest
    # 12 s observed (8–12 across four releases). The variable part is network: downloading the platform
    # binaries out of the artifact store and uploading them again to the releases API.
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      # REL-7 (#164). The two grants build provenance needs and nothing more. `attestations: write` is what
      # stores the signed statement and this is the only job in the repo that has it. `id-token: write` is
      # not a write to the repository: it is what lets the job ask GitHub for an OIDC token about itself,
      # and `publish` below already holds it for exactly the same reason — tokenless auth is the posture
      # ADR-0043 chose for crates.io and this follows it. THE REPO STILL HAS NO SECRETS, and provenance was
      # picked over signing keys so it stays that way.
      id-token: write
      attestations: write
    steps:
      # Checked out for two reasons — `scripts/release-notes.py` builds the release body out of git
      # history, and `scripts/tool-surface.py` reads the committed snapshots (REL-8, #165) — and it goes
      # FIRST because `actions/checkout` clears its target directory. Put it after the download and it
      # deletes `dist/`, taking every binary this run built with it.
      #
      # fetch-depth: 0 is not caution. The notes need the previous tag (`git describe --tags` on the tagged
      # commit's parent) and every commit between it and here; the default depth-1 fetch has neither, and
      # would produce a changelog of one commit against no baseline rather than an error.
      - name: Check out the tagged commit and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `pattern` is the whole point: without it download-artifact takes EVERY artifact the run produced,
      # and this run produces more than binaries — gate-lint calls rust-doctor.yml, which uploads its
      # SARIF. That is not hypothetical. v0.2.1 shipped `rust-doctor.sarif` as a sixth downloadable asset
      # (REL-2, #41), because merge-multiple flattened it into dist/ and `dist/*` uploaded it. Gating on a
      # reusable workflow silently adopts that workflow's artifacts; naming what we want instead of taking
      # what is there is what keeps the next gate's uploads out too.
      - name: Collect every platform's binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: jdwp-mcp-* # the build matrix names its artifacts after the file they carry
          merge-multiple: true # flatten the per-artifact directories into one upload set

      # A pattern only holds while the naming contract behind it does, so check the contract rather than
      # trust it. This runs BEFORE SHA256SUMS exists, so the rule is exactly the one the next two steps
      # use: everything in dist/ is a platform binary. A gate whose artifact happens to start `jdwp-mcp-`
      # would slip past the pattern; it does not slip past this.
      #
      # The empty case needs no guard of its own: if the pattern matched nothing, `sha256sum jdwp-mcp-*`
      # below fails on the unexpanded glob and the release never gets created.
      - name: Fail on anything in dist/ that is not a platform binary
        shell: bash
        working-directory: dist
        run: |
          unexpected=$(ls -A | grep -v '^jdwp-mcp-' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::dist/ holds files this release does not publish. Nothing has been published."
            echo "An artifact was renamed, or a gate started uploading something matching jdwp-mcp-*:"
            echo "$unexpected"
            exit 1
          fi
          ls -l

      # One SHA256SUMS over all of them rather than a .sha256 beside each: that is the form
      # `sha256sum -c SHA256SUMS` consumes directly. The glob is explicit so the file cannot list itself.
      - name: Checksum the assets
        shell: bash
        working-directory: dist
        run: |
          sha256sum jdwp-mcp-* > SHA256SUMS
          cat SHA256SUMS

      # REL-8 (#165). The tool surface is generated and committed and gated by snapshot tests, and it
      # existed ONLY IN THE TREE — so "what changed for callers between the tag I pin and the one I am
      # moving to" needed a clone at two tags and a diff, and the release notes' prose was the only
      # published form of the answer. That is the dependency docs/toolkit-contract.md is uneasy about.
      #
      # WRITTEN OUTSIDE dist/, ON PURPOSE. REL-2 (#41) makes that directory "platform binaries only" after
      # rust-doctor.sarif shipped as a sixth downloadable asset, and the guard above is worth more than the
      # convenience of one directory: an allowlist would have to be kept in step with what the upload
      # names, and a loosened pattern is what let the SARIF through in the first place. `surface/` costs
      # nothing and leaves that guard exactly as strict as it was.
      #
      # NOT LISTED IN SHA256SUMS, and this is the choice #165 asks to be made explicitly. That file is the
      # BINARIES' manifest: `ensure-jdwp.sh` matches the host's asset name against its contents, so a line
      # for a non-binary changes what a consumer that already reads it is reading. Integrity comes from the
      # attestation below instead, which covers this file as well and needs nothing added to SHA256SUMS.
      # The consequence, stated so it is not discovered: the existing consumer cannot see this asset at
      # all, which is the safe direction.
      #
      # BUILT FROM THE COMMITTED SNAPSHOTS rather than regenerated from the binary — see the script's
      # header. What makes that trustworthy is that `gate-tests` above ran the whole suite on this commit,
      # and `tool_descriptions_match_the_committed_snapshot` fails there if the snapshots are stale.
      - name: Assemble the tool surface
        shell: bash
        run: |
          mkdir -p surface
          python3 scripts/tool-surface.py --tag "$GITHUB_REF_NAME" > "surface/tool-surface-$GITHUB_REF_NAME.json"
          # A narrow guarantee, stated narrowly: the asset is what this tree's snapshots produce, checked
          # after it was written rather than assumed. It catches an edit, a truncation or a swap between
          # building and uploading; it does not re-check the snapshots against the binary, which is
          # `cargo test`'s job and already ran.
          python3 scripts/tool-surface.py --tag "$GITHUB_REF_NAME" --check "surface/tool-surface-$GITHUB_REF_NAME.json"
          ls -l surface

      # REL-7 (#164). SHA256SUMS PROVES THE DOWNLOAD, NOT THE BUILD. The manifest and the binaries are
      # produced by the same job and published together, so anything able to replace one can replace the
      # other, and a consumer checking the hash learns only that the bytes match the list shipped beside
      # them. The downstream toolkit installs these binaries onto other people's machines, which is why
      # that gap is worth more than the usual amount of care.
      #
      # This attaches a signed statement to each asset naming the workflow, repository, commit and run that
      # produced it, verifiable with:
      #
      #     gh attestation verify <asset> --repo YgorPerez/java-debugging-mcp
      #
      # WHERE IT SITS IS PART OF THE DESIGN. It attests what is published, in the job that publishes it —
      # this job downloads artifacts into dist/ and runs no project code — rather than in the build matrix,
      # where five separate statements would vouch for five files that still have to survive a trip through
      # the artifact store to get here.
      #
      # IT ADDS NO FILE TO dist/. Attestations go to the attestations API, not to the release assets, so the
      # "fail on anything in dist/ that is not a platform binary" guard above (REL-2, #41) is untouched and
      # stays that way. That is why this step comes after it rather than before.
      #
      # SHA256SUMS IS DELIBERATELY NOT A SUBJECT. Once every binary it lists is individually attested, the
      # manifest carries nothing of its own left to vouch for — a consumer who verifies the attestation does
      # not need it, and one who only checks the hash is no worse off than today. Naming the same
      # `jdwp-mcp-*` glob the checksum and upload steps use also keeps the three from disagreeing about what
      # this release is.
      #
      # THE TOOL SURFACE IS A SUBJECT, and it is the one asset for which this is the ONLY integrity story:
      # it is deliberately absent from SHA256SUMS (REL-8, #165 — see the step above), so without a line
      # here it would be the single published file nothing vouches for.
      #
      # The consumer half — teaching `ensure-jdwp.sh` to run `gh attestation verify` — is the toolkit's, and
      # belongs in the release notes rather than here.
      - name: Attest the provenance of everything this release publishes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/jdwp-mcp-*
            surface/tool-surface-*.json

      # The release body, built here rather than by `--generate-notes`, which this step used to pass.
      #
      # `--generate-notes` lists **merged pull requests**, and a release whose commits were all direct
      # pushes to main generates an empty "What's Changed" — so every release from v0.2.1 to v0.8.0
      # published one line, the compare link, and nothing else. Worse, it never read the release commit's
      # body, which is where `/release` step 4 puts the part that matters: new tools by name, renames with
      # both names, behaviour changes behind an unchanged name. `docs/toolkit-contract.md` points the
      # downstream toolkit at these notes as the one mitigation for five silent failure modes, and the
      # notes did not contain any of it.
      #
      # The script leads with that body verbatim, then categorizes the commits since the previous tag under
      # the same emoji headings b2c-next uses. It is written not to fail a release: a missing narrative or
      # an unreachable baseline drops a section rather than exiting non-zero.
      - name: Build the release notes
        shell: bash
        run: |
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
          # Into the job summary as well, so the published body is reviewable from the run that published
          # it — the releases page is the only other copy, and by then it is public.
          {
            echo "## Release notes published for \`$GITHUB_REF_NAME\`"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The upload globs `jdwp-mcp-*` plus SHA256SUMS and the tool surface BY NAME — the same discipline
      # the checksum step above uses — rather than `dist/*` or `surface/*`. The steps cannot disagree that
      # way: what gets listed is what gets published. `dist/*` is how a file nobody checksummed ended up on
      # the downloads page (#41), and the surface file is named with the tag in it for the same reason
      # every binary is: two of them in one directory would otherwise collide.
      #
      # --verify-tag matters more than it looks: without it `gh release create` happily CREATES a tag
      # that does not exist, so a typo would publish a release pointing at the default branch instead of
      # failing. --prerelease for anything with a hyphen in the version keeps an rc out of
      # /releases/latest, which is what unattended installers follow.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Kept explicit even though this job now checks out the repo, so the publish does not depend on
          # `gh` inferring a target from a remote. It cost a whole green release to learn that failing here
          # is the most expensive place to fail.
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --notes-file release-notes.md --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            dist/jdwp-mcp-* dist/SHA256SUMS "surface/tool-surface-$GITHUB_REF_NAME.json"

  # Publishes both crates to crates.io, so `cargo install jdwp-mcp` works without a GitHub release asset
  # (REL-5). This ADDS a channel; it does not replace the binaries above, which remain the better path for
  # anyone who would rather not install a Rust toolchain and wait for a compile.
  #
  # ## Why there is no CARGO_REGISTRY_TOKEN
  #
  # This uses crates.io Trusted Publishing: GitHub mints a short-lived OIDC token, crates.io verifies it
  # came from this repository and this workflow, and hands back an access token that expires. No credential
  # is stored anywhere, which keeps true the thing CLAUDE.md notes about this repo having no secrets — the
  # same property that made the scaffolded AI-review workflows fail five times in silence.
  #
  # ## The bootstrap, which is a REAL manual step and cannot be automated away
  #
  # crates.io has no equivalent of PyPI's "pending publishers": a trusted publisher is configured ON a
  # crate, so the crate has to exist first. **The first version of each crate must be published by hand**,
  # from a laptop, with a personal API token, and the publisher configured afterwards at
  # <https://crates.io/crates/jdwp-mcp/settings> and the client's equivalent. Until that is done this job
  # fails at the auth step on every tag. See docs/adr/0043 for the full sequence.
  publish:
    name: Publish to crates.io
    needs: [version, package, release]
    runs-on: ubuntu-latest
    # NO SUCCESSFUL RUN TO DERIVE FROM, said out loud rather than dressed up as a measurement: the only run
    # of this job so far failed at the auth step after 17 s, before the bootstrap in ADR-0043 was done. The
    # budget is reasoned instead — two `cargo publish` calls, and cargo blocks between them waiting for the
    # first crate to appear in the index, which is the slow and variable part. Replace this comment with a
    # real observation the first time it succeeds.
    timeout-minutes: 20
    permissions:
      # `id-token: write` is the entire grant, and it is not a write to the repository: it is what lets the
      # job ask GitHub for an OIDC token about itself. `contents: read` is the checkout.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify` because the `package` job already built both crates from their tarballs, and this run
      # is publishing the same commit. Rebuilding here buys nothing and doubles the window in which a
      # half-published workspace can exist.
      #
      # If this fails with "crate version is already uploaded", the version is already ON crates.io and the
      # correct response is to leave it there and cut the next one — re-running will not help, and there is
      # deliberately no `|| true` making that look like success. A published version cannot be replaced.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --no-verify --locked

  # REL-6 (#168). `npx jdwp-mcp` — the install path an MCP server is expected to have, and the one this
  # repo did not: `cargo install` wants a Rust toolchain and a few minutes, and the release binaries want a
  # manual download, which is why the downstream toolkit ships `ensure-jdwp.sh` to do it for people.
  #
  # ONE WRAPPER PACKAGE PLUS FIVE PLATFORM PACKAGES, NO `postinstall` DOWNLOAD. Each platform package
  # carries one prebuilt binary and declares its `os`/`cpu`, so npm installs exactly one of the five and
  # `npx` needs no network at run time. The usual alternative — a `postinstall` that fetches from GitHub —
  # is what makes `npx` unreliable behind a proxy, on an offline runner, or against a rate limit, and it
  # fails at the moment somebody is trying to start a debugger.
  #
  # NO STORED TOKEN, WHICH IS AN ACCEPTANCE CRITERION OF #168 RATHER THAN A PREFERENCE. `id-token: write`
  # lets this job ask GitHub for an OIDC token about itself, which npm exchanges for a short-lived
  # publishing credential — the same property ADR-0043 chose for crates.io, and the reason this repository
  # still has zero secrets. It requires trusted publishing configured on the registry side for all six
  # packages, and npm >= 11.5.1 to use it.
  #
  # IT NEEDS THE BOOTSTRAP FIRST, exactly as crates.io did: trusted publishing attaches to a package that
  # already exists, so the first version of each of the six is published by hand by the maintainer. Until
  # then this job fails at the publish step, which is the honest outcome — there is deliberately no
  # `|| true` making a missing bootstrap look like a success.
  publish-npm:
    name: Publish to npm
    needs: [version, package, release, publish]
    runs-on: ubuntu-latest
    # NO SUCCESSFUL RUN TO DERIVE FROM — the same wording as the crates.io job above, and for the same
    # reason: this has never run against a bootstrapped package. Reasoned instead: six `npm publish` calls
    # against a registry that answers in seconds, plus five asset downloads of a ~5 MB binary each.
    # Replace this with a real observation the first time it succeeds.
    timeout-minutes: 15
    permissions:
      id-token: write # the OIDC exchange; NOT a write to this repository
      contents: read # the checkout, and `gh release download` for the assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `setup-node` IS HERE, AND REMOVING IT WAS A MISTAKE THIS JOB PAID FOR ONCE. v0.21.0's run failed
      # at the npm install with `EACCES: permission denied, mkdir '/usr/local/share/man/man5'` — a global
      # install needs a writable prefix, which is one of the two things this action provides. The other is
      # a PINNED Node: trusted publishing needs >= 22.14.0, and without this the job took whatever the
      # runner image shipped and checked it afterwards. Both problems came from dropping the action to
      # clear a low-confidence zizmor finding, which is the wrong trade — the finding is annotated below
      # instead.
      #
      # NO `registry-url`, deliberately. That input exists to write an `.npmrc` carrying `NODE_AUTH_TOKEN`,
      # which is the stored-token path this job is built to avoid, and npm's default registry is already
      # the one we publish to. No `cache:` either, so the caching zizmor warns about is never switched on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22.14.0"

      # BEFORE the npm install, which is the other half of what v0.21.0 taught: the check was last, so a
      # too-old Node would have produced npm's error rather than this one's. A guard after the thing it
      # guards is not a guard. Prints what it found, per CLAUDE.md's rule about quoting a run.
      - name: Check Node is new enough for trusted publishing
        shell: bash
        run: |
          echo "Node in use: $(node --version)"
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error(`::error::npm trusted publishing needs Node >= 22.14.0; this runner has ${process.versions.node}. Raise node-version on the setup-node step above.`);
              process.exit(1);
            }
          '

      # Trusted publishing is npm 11.5.1 and newer, and the runner's bundled npm is older on every image so
      # far. Pinned rather than `@latest`, because "whatever npm is today" is the drift LINT-1 (#18) pinned
      # clippy to avoid, on the one step that publishes.
      #
      # zizmor's `adhoc-packages` is correct that this installs outside a lockfile and there is no lockfile
      # to put it in: it is the package manager itself, needed before any manifest is read. The exact pin
      # IS the mitigation, and it is reviewed like any other pinned tool version here.
      - name: Install an npm that can do trusted publishing
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g npm@11.6.2
          echo "npm in use:  $(npm --version)"

      # The binaries come from the release this tag just made, so npm publishes the SAME artefacts the
      # GitHub release does rather than a second build of the same commit. `SHA256SUMS` is verified for
      # each one: the toolkit already checks these downloads that way (docs/toolkit-contract.md), and an
      # npm package is a wider distribution than a manual download, not a narrower one.
      - name: Stage the release binaries into the platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh release download "$TAG" --dir "$work" --pattern 'jdwp-mcp-*' --pattern 'SHA256SUMS'
          ( cd "$work" && sha256sum --check --ignore-missing SHA256SUMS )
          # slice -> package dir, binary name. The slice names are release ASSET names, which
          # docs/toolkit-contract.md makes part of the interface — they are not free to rename here.
          while read -r slice pkg bin; do
            [ -z "$slice" ] && continue
            src="$work/jdwp-mcp-${TAG}-${slice}"
            [ "$bin" = "jdwp-mcp.exe" ] && src="${src}.exe"
            if [ ! -f "$src" ]; then
              echo "::error::$src is missing from the $TAG release — refusing to publish a platform package with no binary in it."
              exit 1
            fi
            cp "$src" "npm/${pkg}/${bin}"
            chmod +x "npm/${pkg}/${bin}"
            echo "staged $slice -> npm/${pkg}/${bin}"
          done <<'SLICES'
          linux-x86_64 jdwp-mcp-linux-x64 jdwp-mcp
          linux-aarch64 jdwp-mcp-linux-arm64 jdwp-mcp
          macos-aarch64 jdwp-mcp-darwin-arm64 jdwp-mcp
          macos-x86_64 jdwp-mcp-darwin-x64 jdwp-mcp
          windows-x86_64 jdwp-mcp-windows-x64 jdwp-mcp.exe
          SLICES

      # THE WRAPPER IS PUBLISHED LAST, AND THAT ORDERING IS THE "ALL OR NONE" GUARANTEE. npm has no
      # transaction across six packages, so the closest available thing is to make the package a caller
      # actually names — `npx jdwp-mcp` — the final one. If any platform publish fails, the wrapper for
      # this version never appears, `npx jdwp-mcp@<version>` does not resolve, and nobody can install a
      # half-published set. The orphaned platform packages are inert: nothing depends on them until the
      # wrapper exists.
      #
      # A version already on npm makes its `npm publish` fail, and that is left to fail for the reason the
      # cargo step above states — a published version cannot be replaced, and re-running will not help.
      # ONE BLOCKED NAME MUST NOT STRAND THE OTHERS, and this loop learned that from v0.21.0: npm refused
      # `jdwp-mcp-win32-x64` after the other four had published, and a fail-fast loop would have left those
      # four on the registry with no wrapper pointing at them — unusable, because the wrapper is the only
      # package `npx` names.
      #
      # THAT REFUSAL WAS READ AS SPAM DETECTION AND WAS SOMETHING WORSE. It presented as
      # `403 … Package name triggered spam detection`, so this comment and docs/agents/releasing.md both
      # said to wait for npm to clear the name. npm did not clear it: on 2026-08-12 the name became an npm
      # security-holder package owned by `npm-support`, which is why the Windows package is now
      # `jdwp-mcp-windows-x64` (REL-10, #194). The lesson worth keeping is that a `403` on a publish can mean
      # the name is gone rather than the attempt was throttled, and the two look identical from here.
      #
      # A subset is LESS BAD than a half-published wrapper, which is not the same as safe — and the earlier
      # wording here ("the platforms that published work completely") quietly assumed the missing platform
      # would be a rare one. At v0.22.0 it was linux-x86_64, the commonest there is: an
      # `optionalDependencies` entry that does not resolve is skipped SILENTLY by npm, so that platform
      # installed the wrapper, got no binary, and fell through to the shim's message. REL-7 (#184) is the
      # record. The shim does at least tell that caller the truth — it distinguishes "you passed
      # --omit=optional" from "this version shipped without your platform" — but a caller reaching a shim
      # message is a broken install, not a working subset.
      #
      # The exact pin is what makes it repairable without a release: publishing the missing package later
      # makes the already-published wrapper find it. That is how v0.22.0's linux-x86_64 gap was closed, on
      # attempt 3 of its own run. It only works for a name we can still publish to — which Windows no
      # longer was, and is the reason that platform needed a rename rather than a re-run.
      #
      # SO: publish what can be published, ASK THE REGISTRY WHAT IT ACTUALLY SERVES, then FAIL THE JOB naming
      # what does not resolve. There is deliberately no `|| true` — a subset shipping unnoticed is the thing
      # this must not do, and in CI nobody can be asked to confirm, so the red run IS the confirmation being
      # demanded after the fact. `publish-npm` is the last job and the release and crates.io have already
      # shipped by here, so a red here blocks nothing — it is a flag, which is exactly what an incomplete
      # platform set deserves.
      #
      # The middle clause is REL-10 (#194) and it is the one that was missing. The gap this job shipped with
      # was not that it failed to notice a failed publish; it noticed. It was that "did not publish" and
      # "the registry does not serve this" are different questions, and it only ever asked the first — so a
      # re-run counted its own earlier successes as failures, and a publish that exited 0 without landing
      # would have gone unremarked. `npm view` is the observation; an exit code is a claim.
      - name: Publish the platform packages, then the wrapper last
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version="${TAG#v}"
          pkgs=(jdwp-mcp-linux-x64 jdwp-mcp-linux-arm64 jdwp-mcp-darwin-arm64 jdwp-mcp-darwin-x64 jdwp-mcp-windows-x64)

          # Is this exact version on the registry NOW? One question, asked in two places below for two
          # different reasons, so it is one function rather than two spellings that can disagree.
          on_registry() { [ "$(npm view "$1@$version" version 2>/dev/null || true)" = "$version" ]; }

          for pkg in "${pkgs[@]}"; do
            echo "::group::npm publish $pkg"
            # ALREADY PUBLISHED IS NOT A FAILURE, and reading it as one is a bug this job had. `npm publish`
            # of an existing version exits non-zero, so on a RE-RUN every package that succeeded the first
            # time was counted as having "did not publish" — which is v0.22.0's history exactly: attempt 3
            # was re-run to land linux-x86_64, and the four already up would each have been reported as a
            # failure. The registry is the authority on what exists, not this loop's exit codes.
            if on_registry "$pkg"; then
              echo "$pkg@$version is already on the registry — nothing to do"
            elif ( cd "npm/$pkg" && npm publish --access public ); then
              echo "published $pkg"
            else
              echo "::warning::$pkg did not publish"
            fi
            echo "::endgroup::"
          done

          # THE PRE-FLIGHT, AND THE POINT OF IT: what the registry SERVES, asked before the wrapper goes up.
          # REL-7 (#184) is why this is not the publish loop's exit codes. A wrapper that pins a version no
          # registry has is the failure there, npm skips an unresolvable `optionalDependencies` entry
          # silently, and the five results are all knowable before the wrapper is published. An
          # `npm publish` that exits 0 is a claim; `npm view` is the observation.
          echo "::group::does every pinned platform resolve at $version?"
          missing=()
          for pkg in "${pkgs[@]}"; do
            # npm can lag its own publish by a few seconds, and a false "does not resolve" would turn a
            # good release red. Bounded retry for that — the same reasoning as the `--retry` on this
            # workflow's downloads. A genuine 404 costs 12 s here and is worth naming correctly.
            resolved=""
            for attempt in 1 2 3 4 5; do
              if on_registry "$pkg"; then resolved=yes; break; fi
              [ "$attempt" -lt 5 ] && sleep 3
            done
            if [ -n "$resolved" ]; then
              echo "resolves: $pkg@$version"
            else
              echo "::warning::does NOT resolve: $pkg@$version — the wrapper pins it and npm will skip it silently"
              missing+=("$pkg")
            fi
          done
          echo "::endgroup::"

          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::error::no platform package resolves at $version, so there is nothing for a wrapper to point at. Not publishing the wrapper."
            exit 1
          fi

          # The wrapper goes last, always, and only once at least one platform is up. It keeps ALL FIVE pins
          # even when one is missing, deliberately: the exact pin is what lets a later publish of the missing
          # package fix the already-published wrapper with no new release, which is how v0.22.0's
          # linux-x86_64 gap was closed. Narrowing the pins to what published would trade that repair path
          # for tidier metadata, and buy the caller nothing — `require.resolve` fails either way and the shim
          # prints the same message.
          echo "::group::npm publish jdwp-mcp (the wrapper)"
          if on_registry jdwp-mcp; then
            echo "jdwp-mcp@$version is already on the registry — nothing to do"
          else
            ( cd npm/jdwp-mcp && npm publish --access public ) || {
              echo "::error::the wrapper did not publish. The platform packages above are inert until it does."
              exit 1
            }
          fi
          echo "::endgroup::"

          if [ "${#missing[@]}" -ne 0 ]; then
            {
              echo "## npm: shipped ${#missing[@]} platform(s) short"
              echo
              echo "The wrapper is published and pins all 5 platforms. $(( 5 - ${#missing[@]} )) resolve."
              echo "These do NOT, so \`npx jdwp-mcp\` on them installs the wrapper and gets **no binary**:"
              for f in "${missing[@]}"; do echo "- \`$f@$version\`"; done
              echo
              echo "Those platforms fall back to \`cargo install jdwp-mcp\`, which the launcher tells them."
              echo "The pin is exact, so publishing a missing one later makes the already-published wrapper"
              echo "find it — no new release needed, PROVIDED the name is still ours to publish to."
              echo "(\`jdwp-mcp-win32-x64\` stopped being, which is REL-10 #194. Check the name is not an npm"
              echo "security-holder package before assuming a re-run is the fix.)"
              echo
              echo '```'
              for f in "${missing[@]}"; do echo "( cd npm/$f && npm publish --access public )"; done
              echo '```'
              echo
              echo "Then confirm, because a publish exiting 0 is not the registry serving it:"
              echo
              echo '```'
              for f in "${missing[@]}"; do echo "npm view $f@$version version"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::npm shipped without: ${missing[*]}. The wrapper IS published, so the other platforms work; this job is red so the gap is not missed."
            exit 1
          fi
