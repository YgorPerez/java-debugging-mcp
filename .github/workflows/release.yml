name: release

# Builds `jdwp-mcp` for the platforms this project is actually used from and attaches the binaries to a
# GitHub release, so installing needs no Rust toolchain (REL-1, #34).
#
# The job order is the safety property, not a preference:
#   version -> {gate-tests, gate-lint, build, package} -> release -> publish
# `version` is toolchain-free and finishes in seconds, so a tag that disagrees with the manifest costs
# nothing and, more importantly, cannot reach a job that publishes. `release` waits on both gates.
#
# `publish` (crates.io, REL-5) is deliberately LAST, and that is the one ordering here chosen for
# reversibility rather than for speed. A GitHub release can be deleted and cut again; a crates.io version
# can only be YANKED, and a yanked version still occupies its number forever. So the recoverable publish
# goes first and the irreversible one goes last, which makes the bad case "crates.io is a release behind"
# — fixable by re-running this job — instead of "0.20.0 exists on crates.io and nowhere else".
#
# `package` is the other half of that argument: it is a full `cargo publish --dry-run` running in parallel
# with the binary matrix, and `release` waits on it. Packaging has its own failure modes that nothing else
# in this pipeline exercises — a missing `description`, an unpublishable path dependency, a version already
# taken — and every one of them is cheap before the tag is public and expensive after.
#
# The gates are CALLED here rather than assumed to have run: tests.yml and rust-doctor.yml trigger on
# push-to-main and pull_request, so a tag ref fires neither. Without this a tag placed on a commit that
# never faced them — or on a branch that never merged — would publish in silence.

on:
  push:
    # Deliberately loose: the `version` job below is the real check, and a tag that gets this far only to
    # be rejected there produces a visible failure, whereas a tag that misses a strict filter produces
    # nothing at all and looks like the workflow is broken.
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # NOT cancel-in-progress, unlike every other workflow here. Cancelling mid-upload leaves a published
  # release carrying a subset of its assets and a SHA256SUMS that lists files nobody can download; a
  # duplicate run is the cheaper failure.
  cancel-in-progress: false

jobs:
  version:
    name: Tag agrees with the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # [workspace.package].version is the single source of truth and the tag is a claim about it. Read
      # the TOML directly rather than asking cargo: it keeps the first job free of a toolchain install,
      # which is what makes it cheap enough to run before everything else. tomllib is stdlib as of
      # Python 3.11 and the ubuntu runner image ships 3.12.
      - name: Compare the tag against [workspace.package].version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as f:
              manifest = tomllib.load(f)["workspace"]["package"]["version"]
          if tag != f"v{manifest}":
              print(f"::error::Tag {tag} does not match [workspace.package].version {manifest}. "
                    f"Either the tag should be v{manifest}, or Cargo.toml was never bumped. "
                    f"Nothing has been built or published.")
              sys.exit(1)
          print(f"{tag} matches [workspace.package].version = {manifest}")
          PY

  # Re-running the gates costs a few minutes and buys the guarantee the acceptance criteria ask for: the
  # release is bound to the gate's verdict for THIS commit, not to whatever happened to be green on main
  # when the tag was cut.
  # tests.yml is a JDK matrix as of TEST-11 (#36), so this one `needs:` now waits on every leg — 11, 17
  # and 21 — not on a single job. A called workflow succeeds only when all of its jobs do, and its
  # `fail-fast: false` only keeps the other legs running to report; it does not let a red leg through.
  gate-tests:
    name: Gate (tests)
    needs: version
    uses: ./.github/workflows/tests.yml

  gate-lint:
    name: Gate (lint)
    needs: version
    uses: ./.github/workflows/rust-doctor.yml
    # THIS is the ref the semver check gates on (CI-2, #122). On a push to main or a PR the same job reports
    # a break and concludes green, because between releases the working version equals the baseline tag and
    # every break violates it — a red for the whole cycle that could only be cleared by cutting the release.
    # Here the release IS being cut, the version has been chosen, and a public API that outruns it must block
    # the tag: the version number is what the downstream toolkit pins.
    with:
      gate_semver: true
    # security-events: write is rust-doctor.yml's own requirement — it publishes its SARIF to code
    # scanning — and is granted to this job alone. The job that can write to the repository is `release`,
    # and it carries contents: write and nothing else.
    permissions:
      contents: read
      security-events: write

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide whether the others would have built; with `needs` on the
      # release job a partial matrix still cannot publish.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Both macOS slices are cross-compiled from the arm64 runner. macos-13 is the only Intel image
          # left and it is on a retirement clock; the Apple SDK on the arm64 image targets both
          # architectures, and nothing here is tested at release time anyway — the gates above already
          # ran the suite.
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `stable`, matching tests.yml and coverage.yml — NOT the pin in rust-toolchain.toml. That pin exists
      # for exactly one reason (#18): rust-doctor fails the build on clippy warnings, so a new lint in a
      # newer toolchain would break code nobody touched. This job compiles and gates on nothing, so a
      # second pinned version number here would buy no safety and add a second thing to remember to bump
      # — the maintenance hazard LINT-2 (#28) is about.
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # Explicit, because rust-toolchain.toml pins the gate's toolchain and would otherwise govern here — and
          # shipping release binaries built by an old pinned compiler is not what that pin is for.
          toolchain: stable
          targets: ${{ matrix.target }}
          # rust-cache keys on job and host, not on --target, so without this the two macOS slices share
          # the arm64 runner's cache entry and fight over it.
          cache-key: ${{ matrix.target }}

      # GLIBC: the Linux slice is static musl, not glibc, and that is a deliberate answer to where these
      # binaries run. This debugger attaches to Java app servers, which are routinely older than a GitHub
      # runner image; a glibc build carries a hard floor and dies on anything older with
      # `version 'GLIBC_2.xx' not found`. Choosing an older runner image only lowers that floor, and puts
      # the choice on a deprecation clock. musl removes the floor: crt-static is the default for this
      # target, so the result depends on the kernel and nothing else. The workspace is pure Rust down to
      # libc (serde/serde_json/tokio/tracing/bytes/schemars — no -sys crate in Cargo.lock), so there is
      # no C dependency to fight, and musl's slower allocator does not matter to a process that spends
      # its life blocked on a socket.
      #
      # rustc drives this target's link through the runner's `cc` using its own bundled crt objects, so a
      # pure-Rust build most likely needs nothing extra; musl-gcc is installed regardless because one apt
      # line is cheaper than finding out otherwise during a release.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked: Cargo.lock is committed, and a release is the one build where resolving something newer
      # than what the gates just tested is unacceptable. -p jdwp-mcp keeps the examples and the client's
      # dev-dependencies out of a build whose only output is one binary.
      - name: Build jdwp-mcp
        run: cargo build --release --locked --target ${{ matrix.target }} -p jdwp-mcp

      # Named for the person downloading it. Every platform's binary is `jdwp-mcp` inside target/, which
      # collides the moment they land in one directory, and a target triple answers the question only if
      # you already know how to read one.
      - name: Name the artifact for a human
        shell: bash
        run: |
          asset="jdwp-mcp-${GITHUB_REF_NAME}-${{ matrix.name }}${{ matrix.ext }}"
          mv "target/${{ matrix.target }}/release/jdwp-mcp${{ matrix.ext }}" "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # The artifact is named after the FILE it carries, not after the matrix slice, so that one glob —
      # `jdwp-mcp-*` — selects this job's output at every stage: the download below, the checksum, the
      # upload. Naming it `${{ matrix.name }}` (`linux-x86_64`) meant the download had no way to say
      # "mine" without listing the slices, which is how REL-2 (#41) happened.
      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Everything the real publish does except the upload, so a packaging failure is found while the only cost
  # of failing is a red run. `--dry-run` builds each crate from the tarball it would actually send, which is
  # what catches the class of break that only exists inside a `.crate`: a source file cargo declines to copy,
  # a dependency that resolves locally through `path` and has no `version` for a stranger to resolve, a
  # required manifest field left empty.
  #
  # It does NOT catch a version already on crates.io — `--dry-run` skips that check. The publish job is
  # where that surfaces, and it is why `release.sh` refuses to reuse a tag.
  package:
    name: Crates package cleanly
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # `stable`, for the same reason the build matrix says so at its own call site: rust-toolchain.toml
          # pins the GATE's compiler, and what is published should build on current Rust rather than on
          # whatever version the lint pin happens to sit at.
          toolchain: stable

      # --workspace publishes both members and works out the order itself: `java-debugging-jdwp-client`
      # cannot go second, because `jdwp-mcp` names it as a dependency. Doing that ordering by hand is a
      # second copy of a fact cargo already knows.
      #
      # Twelve `warning: ignoring example ... is not included in the published package` lines are EXPECTED
      # here — jdwp-client declares example targets under `../examples/`, outside its own package root, and
      # they are deliberately not shipped. jdwp-client/Cargo.toml carries the full reason.
      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked

  release:
    name: Publish the release
    needs: [version, gate-tests, gate-lint, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets; nothing else is needed
    steps:
      # Checked out for ONE reason — `scripts/release-notes.py` builds the release body out of git history
      # — and it goes FIRST because `actions/checkout` clears its target directory. Put it after the
      # download and it deletes `dist/`, taking every binary this run built with it.
      #
      # fetch-depth: 0 is not caution. The notes need the previous tag (`git describe --tags` on the tagged
      # commit's parent) and every commit between it and here; the default depth-1 fetch has neither, and
      # would produce a changelog of one commit against no baseline rather than an error.
      - name: Check out the tagged commit and its history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # `pattern` is the whole point: without it download-artifact takes EVERY artifact the run produced,
      # and this run produces more than binaries — gate-lint calls rust-doctor.yml, which uploads its
      # SARIF. That is not hypothetical. v0.2.1 shipped `rust-doctor.sarif` as a sixth downloadable asset
      # (REL-2, #41), because merge-multiple flattened it into dist/ and `dist/*` uploaded it. Gating on a
      # reusable workflow silently adopts that workflow's artifacts; naming what we want instead of taking
      # what is there is what keeps the next gate's uploads out too.
      - name: Collect every platform's binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: jdwp-mcp-* # the build matrix names its artifacts after the file they carry
          merge-multiple: true # flatten the per-artifact directories into one upload set

      # A pattern only holds while the naming contract behind it does, so check the contract rather than
      # trust it. This runs BEFORE SHA256SUMS exists, so the rule is exactly the one the next two steps
      # use: everything in dist/ is a platform binary. A gate whose artifact happens to start `jdwp-mcp-`
      # would slip past the pattern; it does not slip past this.
      #
      # The empty case needs no guard of its own: if the pattern matched nothing, `sha256sum jdwp-mcp-*`
      # below fails on the unexpanded glob and the release never gets created.
      - name: Fail on anything in dist/ that is not a platform binary
        shell: bash
        working-directory: dist
        run: |
          unexpected=$(ls -A | grep -v '^jdwp-mcp-' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::dist/ holds files this release does not publish. Nothing has been published."
            echo "An artifact was renamed, or a gate started uploading something matching jdwp-mcp-*:"
            echo "$unexpected"
            exit 1
          fi
          ls -l

      # One SHA256SUMS over all of them rather than a .sha256 beside each: that is the form
      # `sha256sum -c SHA256SUMS` consumes directly. The glob is explicit so the file cannot list itself.
      - name: Checksum the assets
        shell: bash
        working-directory: dist
        run: |
          sha256sum jdwp-mcp-* > SHA256SUMS
          cat SHA256SUMS

      # The release body, built here rather than by `--generate-notes`, which this step used to pass.
      #
      # `--generate-notes` lists **merged pull requests**, and a release whose commits were all direct
      # pushes to main generates an empty "What's Changed" — so every release from v0.2.1 to v0.8.0
      # published one line, the compare link, and nothing else. Worse, it never read the release commit's
      # body, which is where `/release` step 4 puts the part that matters: new tools by name, renames with
      # both names, behaviour changes behind an unchanged name. `docs/toolkit-contract.md` points the
      # downstream toolkit at these notes as the one mitigation for five silent failure modes, and the
      # notes did not contain any of it.
      #
      # The script leads with that body verbatim, then categorizes the commits since the previous tag under
      # the same emoji headings b2c-next uses. It is written not to fail a release: a missing narrative or
      # an unreachable baseline drops a section rather than exiting non-zero.
      - name: Build the release notes
        shell: bash
        run: |
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
          # Into the job summary as well, so the published body is reviewable from the run that published
          # it — the releases page is the only other copy, and by then it is public.
          {
            echo "## Release notes published for \`$GITHUB_REF_NAME\`"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The upload globs `jdwp-mcp-*` plus SHA256SUMS by name — the same discipline the checksum step
      # above uses — rather than `dist/*`. The two cannot disagree that way: what gets listed is what gets
      # published. `dist/*` is how a file nobody checksummed ended up on the downloads page (#41).
      #
      # --verify-tag matters more than it looks: without it `gh release create` happily CREATES a tag
      # that does not exist, so a typo would publish a release pointing at the default branch instead of
      # failing. --prerelease for anything with a hyphen in the version keeps an rc out of
      # /releases/latest, which is what unattended installers follow.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Kept explicit even though this job now checks out the repo, so the publish does not depend on
          # `gh` inferring a target from a remote. It cost a whole green release to learn that failing here
          # is the most expensive place to fail.
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --notes-file release-notes.md --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/jdwp-mcp-* dist/SHA256SUMS

  # Publishes both crates to crates.io, so `cargo install jdwp-mcp` works without a GitHub release asset
  # (REL-5). This ADDS a channel; it does not replace the binaries above, which remain the better path for
  # anyone who would rather not install a Rust toolchain and wait for a compile.
  #
  # ## Why there is no CARGO_REGISTRY_TOKEN
  #
  # This uses crates.io Trusted Publishing: GitHub mints a short-lived OIDC token, crates.io verifies it
  # came from this repository and this workflow, and hands back an access token that expires. No credential
  # is stored anywhere, which keeps true the thing CLAUDE.md notes about this repo having no secrets — the
  # same property that made the scaffolded AI-review workflows fail five times in silence.
  #
  # ## The bootstrap, which is a REAL manual step and cannot be automated away
  #
  # crates.io has no equivalent of PyPI's "pending publishers": a trusted publisher is configured ON a
  # crate, so the crate has to exist first. **The first version of each crate must be published by hand**,
  # from a laptop, with a personal API token, and the publisher configured afterwards at
  # <https://crates.io/crates/jdwp-mcp/settings> and the client's equivalent. Until that is done this job
  # fails at the auth step on every tag. See docs/adr/0043 for the full sequence.
  publish:
    name: Publish to crates.io
    needs: [version, package, release]
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` is the entire grant, and it is not a write to the repository: it is what lets the
      # job ask GitHub for an OIDC token about itself. `contents: read` is the checkout.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify` because the `package` job already built both crates from their tarballs, and this run
      # is publishing the same commit. Rebuilding here buys nothing and doubles the window in which a
      # half-published workspace can exist.
      #
      # If this fails with "crate version is already uploaded", the version is already ON crates.io and the
      # correct response is to leave it there and cut the next one — re-running will not help, and there is
      # deliberately no `|| true` making that look like success. A published version cannot be replaced.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --no-verify --locked
