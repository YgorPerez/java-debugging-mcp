name: tests

# Two layers, both gating:
#   - unit tests (fast, no JVM), once
#   - MCP-level integration tests: the real `jdwp-mcp` binary driven over JSON-RPC against probe JVMs
#     that the harness compiles, launches and reaps itself (mcp-server/tests/mcp_integration.rs), once
#     per JDK in the matrix below
#
# The integration tests need a JDK — WITHOUT one they print `SKIP` and pass, which would make the job
# green while testing nothing. That is why a JDK is installed explicitly and why the step below fails
# the build if it sees a SKIP line.
#
# The two layers are separate JOBS, which they did not used to be, and the reason is attribution rather
# than speed. Once the integration side is a matrix, a single "Unit + integration" job would report a
# broken unit test as three simultaneous red JDK legs — which reads as "the debugger is broken on every
# JVM" and is the exact misreading TEST-11 (#36) asked to prevent. Split, a red `Unit` means the code and
# a red `Integration (JDK 11)` means that JDK. The unit tests are also JDK-independent, so running them
# once instead of once per leg costs nothing to say.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a tag on this suite. A tag ref matches neither trigger above, so
  # without this the release would be relying on a run that happened on a different ref (REL-1, #34).
  #
  # A called workflow succeeds only when EVERY job in it succeeds, so the caller's single `needs:
  # gate-tests` now waits on the whole matrix rather than on one job. That is the behaviour release.yml
  # wants and it needed no change there — worth stating because `fail-fast: false` below makes a partial
  # matrix look survivable, and it is not: one red leg still blocks the release.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Unaffected by the matrix: concurrency is per workflow RUN, not per job, so all legs live inside one
  # group entry and cancel together when the ref is pushed again. Under `workflow_call` this is evaluated
  # in the caller's context — `refs/tags/vX.Y.Z` for a release — which is a different group from
  # release.yml's own, so a release cannot cancel the gate it is waiting on.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # Explicit, because rust-toolchain.toml pins the gate's toolchain and would otherwise govern here. These
          # legs stay on `stable` on purpose: they are the signal that the code still builds and tests on
          # current Rust, which the gate's pinned toolchain cannot tell us. Read the action's
          # `Rust in use:` line to confirm which one a leg actually got.
          toolchain: stable
          # `shared-key` rather than the default, and it is the same string in the integration job below.
          # rust-cache keys on the JOB name by default, so splitting one job into four would have turned one
          # cargo build into four cold ones — and the JDK a leg installs changes nothing about the Rust
          # artifacts, so there is no reason for them to be different entries.
          cache-shared-key: tests

      # No JDK step here on purpose. Everything `cargo test` runs is either JVM-free or `#[ignore]`d —
      # including mcp-server/tests/stdio_protocol.rs, which drives the real binary's front door with
      # malformed input and needs no JDK precisely so it is not hidden behind the ignore flag that exists
      # for tests that do (TEST-9, #25).
      # Deliberately NOT given the per-test timing report that the integration legs now publish (TEST-26,
      # #103), and the reason is that the report would be empty rather than short. Timings come from
      # libtest's nightly-gated `--report-time`, which needs `RUSTC_BOOTSTRAP=1` on the test binary and must
      # never reach `cargo` — it is hashed into the build fingerprint, so setting it on a `cargo test`
      # invocation recompiles the workspace (measured: 14 s locally) and compiles it under a flag that makes
      # nightly-only features build silently. Getting timings here would mean enumerating and running every
      # unit and cassette binary by hand, to rank a layer that finishes in seconds.
      #
      # So this stays one number, and the honest version of that is saying so here rather than publishing a
      # summary section that always reads "no per-test timings in this log". If this layer ever grows a slow
      # test, split build from run the way scripts/integration-test.sh does.
      - name: Unit tests
        run: cargo test

  integration:
    name: Integration (JDK ${{ matrix.java }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # One JDK failing must not hide whether the others would have passed: with a version matrix the
      # useful finding is almost always *which* versions broke, and fail-fast throws that away. It does
      # not weaken the release gate — see the `workflow_call` note above.
      fail-fast: false
      matrix:
        # Why these three, and why the suite ran on one for so long.
        #
        # 11 is the leg that matters. The shared 8180 is a WildFly 21 and the maintainer confirmed it runs
        # JDK 11 (#36), so every green run before this one validated the debugger against a JVM generation
        # the actual target is not. That was not hypothetical: the first local run on 11 failed 50 of 53
        # tests — not a JDWP difference but `javac` reading source in the platform charset before JEP 400,
        # so every probe comment containing an em dash failed to compile and no probe would start. Fixed in
        # a16bb90 by compiling with `-encoding UTF-8`. This leg is what stops that returning.
        #
        # 21 stays because it is what developers run locally, and 17 is the generation between them for one
        # runner's worth of cost.
        #
        # 8 is deliberately absent. Nothing in the estate runs it, and with the 8180 answered as 11 an
        # 8 leg would gate the build on a JVM nobody here debugs.
        #
        # What the matrix does NOT buy, so nobody expects it: it cannot reach the `JDWP < 1.6` degradation
        # path. JDWP's version tracks the JDK, so even 8 would speak 1.8. That path needs `FaultRelay`
        # (7db6318) rewriting the `Version` reply, or a recorded cassette (#37).
        #
        # The finding as of TEST-11 and still true at 118 tests: 11, 17 and 21 are all green with the same
        # set, so no test needs a version-gated skip and none has one. If that changes, skip it explicitly
        # with the reason rather than narrowing the matrix — a leg quietly removed is indistinguishable from
        # a leg that passes.
        java: ['11', '17', '21']

        # Two shards per JDK (TEST-29, #106), so six legs. Landed on measurement rather than on the guess in
        # the issue, which expected the answer to be no:
        #
        #   - **Execution is 87% of a leg** — 188 s of tests against 28 s of everything else. #106 said it
        #     would close `wontfix` if setup dominated. It does not.
        #   - Splitting by MEASURED duration gives 283 s / 284 s of test time, so neither shard is the tail.
        #     `scripts/shard-plan.py` does that from `mcp-server/tests/timings.tsv`; a split by *name* had a
        #     1-in-8 chance of piling the four resume-honesty tests — 29% of the suite between them — into one
        #     shard, which would have made one leg the whole wall clock and looked fine on the run someone
        #     checked.
        #   - The JDK install measures **0 s** on these runners and the cargo cache restore 4–6 s, so the
        #     "nine installs and nine cache restores" cost #106 worried about is not what bites.
        #
        # **Why 2 and not 3.** The slowest single test is 70 s and cannot be split, so it is a floor: shard 1
        # measures 79 s of wall clock against a 70 s test inside it. A third shard divides test time the floor
        # already dominates — it buys almost nothing and costs three more runners.
        #
        # **The known risk, accepted deliberately.** Fewer tests per shard means fewer probe JVMs contending
        # at once, and #106 warns that contention is the variable this repo has misread twice. #45, #56, #64
        # and #71 are open, and this change could plausibly stop some of them reproducing without fixing
        # them. That was the maintainer's call, made with the trade stated. If a flake investigation needs the
        # old contention, `scripts/integration-test.sh` with no `--shard` still runs all 118 in one process.
        shard: ['1', '2']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # `stable` on purpose — see the note in the `unit` job.
          toolchain: stable
          # Shared with the `unit` job on purpose — see the note there.
          cache-shared-key: tests

      # javac is required, not just a JRE: the harness compiles examples/probes/*.java at test time.
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # A leg that silently tested the WRONG JDK is the same class of failure as a leg that tested nothing:
      # green, and evidence-free. The runner image ships several JDKs of its own, so if setup-java ever
      # stopped exporting the version it was asked for, the suite would still find *a* javac, still pass,
      # and this matrix would quietly be three copies of one leg.
      #
      # KEPT rather than subsumed by TEST-18 (#52), deliberately, because it and the harness check two
      # different halves and neither implies the other:
      #
      #   - this step asserts $JAVA_HOME is the version THIS LEG ASKED FOR. Only the matrix knows that
      #     number; the harness has never heard of it and #52 put matching a requested version explicitly
      #     out of scope.
      #   - `Jdk::find` asserts $JAVA_HOME IS WHAT ACTUALLY RAN — it now fails on an unusable one instead of
      #     falling through to PATH, and every run prints which JDK it used.
      #
      # "this leg tested the version it asked for" is the conjunction, and each guard alone leaves the
      # other half open: a correct $JAVA_HOME that the harness declined to use, or a happily-used
      # $JAVA_HOME holding the wrong version. Two guards, on purpose, for one property in two pieces.
      #
      # If a JDK 8 leg is ever added, this comparison needs widening first: 8's javac reports itself as
      # `javac 1.8.0_xxx`, so an `8` entry would fail the assert rather than the tests.
      - name: Confirm this leg is on JDK ${{ matrix.java }}
        shell: bash
        run: |
          version="$("$JAVA_HOME/bin/javac" -version 2>&1 | awk '{print $2}')"
          case "$version" in
            ${{ matrix.java }} | ${{ matrix.java }}.*) echo "JAVA_HOME=$JAVA_HOME is javac $version" ;;
            *)
              echo "::error::This leg asked for JDK ${{ matrix.java }} but JAVA_HOME holds javac $version — it would have tested the wrong JVM and passed."
              exit 1
              ;;
          esac

      # Split out of the step below so the per-leg **build** cost is a measured number instead of one
      # inferred by subtracting a local timing from a CI step. TEST-27 (#104) proposes hoisting this build
      # into a single shared job, and that proposal is only worth landing if this number is bigger than a
      # whole extra job's fixed cost plus an artifact round trip — which cannot be judged while the build
      # hides inside a 184 s step. `integration-test.sh` builds too, so this step does the work and the
      # script's own build becomes a no-op; nothing about what runs changes.
      - name: Build the integration test binary
        run: cargo test --test mcp_integration --no-run

      # Scoped to --test mcp_integration on purpose: a bare `cargo test -- --ignored` also un-ignores
      # jdwp-client's illustrative ```ignore doctests, which were never meant to compile.
      #
      # `shell: bash` is load-bearing, not decoration, and it has to survive into EVERY leg. A `run:` step
      # without it gets `bash -e` and NO pipefail, so in `script | tee log` the pipeline's status is TEE's
      # — and a failing test suite exited 1 into a tee that exited 0, leaving this step green. The SKIP grep
      # below would not have caught it either: that looks for skips, not failures. Naming the shell turns on
      # pipefail.
      # `--shard` is the one argument this script interprets rather than forwarding to libtest, and the shard
      # plan's report goes into the log — including the name of any test with no recorded duration, which is
      # the one way sharding goes quietly wrong.
      - name: Integration tests
        shell: bash
        run: scripts/integration-test.sh --shard ${{ matrix.shard }}/2 2>&1 | tee integration.log

      # Runs per leg, which is the point: a leg whose JDK failed to install must go red, never
      # green-with-zero-tests. The message names the JDK so the failure is attributable to a version rather
      # than to the code.
      - name: Fail if any integration test was skipped
        shell: bash
        run: |
          if grep -q 'SKIP .*no JDK found' integration.log; then
            echo "::error::Integration tests skipped on JDK ${{ matrix.java }} (no JDK found) — this leg would be green without testing anything:"
            grep 'SKIP .*no JDK found' integration.log
            exit 1
          fi

      # Fourth member of the green-run-of-nothing family, and it exists because sharding created the gap.
      # `scripts/shard-plan.py` refuses a plan that is not a partition, so a test cannot fall between the two
      # shards — but that check runs INSIDE a leg, and it cannot see whether the other leg ran at all. What
      # this step asserts is the half a single leg can know: that this leg ran the number of tests its own
      # plan said it would. A shard that selected 60 and ran 40 is a leg reporting green over 20 tests nobody
      # executed, and every other guard here would pass it.
      - name: Confirm this shard ran the tests it selected
        shell: bash
        run: |
          selected="$(sed -n 's/^shard [0-9]*\/[0-9]*: \([0-9]*\) tests selected.*/\1/p' integration.log | head -1)"
          ran="$(sed -n 's/^test result: \w*\. \([0-9]*\) passed.*/\1/p' integration.log | head -1)"
          if [ -z "$selected" ] || [ -z "$ran" ]; then
            echo "::error::Could not read the selected/ran counts out of the log, so this leg's coverage is unattributable."
            exit 1
          fi
          if [ "$selected" != "$ran" ]; then
            echo "::error::Shard ${{ matrix.shard }}/2 on JDK ${{ matrix.java }} selected $selected tests but ran $ran — the difference was never executed."
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/2 selected $selected tests and ran $selected"

      # Per-test durations into the job summary (TEST-26, #103), so the ranking is readable without
      # downloading a log. Published for ALL THREE legs rather than the one the issue asked for: the marginal
      # cost is a second, and three rankings side by side answer a question one cannot — whether a slow test
      # is slow everywhere or slow on one JVM generation. That is the same reasoning the matrix itself exists
      # for.
      #
      # `if: always()` because a failing leg is when the ranking is most worth having: a test that failed on
      # a timeout is exactly the one you want to see at the top. It cannot rescue a red leg — it publishes a
      # summary and does not touch the step's status, and `integration.log` exists by then either way.
      - name: Publish per-test timings for JDK ${{ matrix.java }} shard ${{ matrix.shard }}
        if: always()
        shell: bash
        run: |
          scripts/test-timings.py --markdown \
            --label 'Integration (JDK ${{ matrix.java }}, shard ${{ matrix.shard }}/2)' \
            integration.log >> "$GITHUB_STEP_SUMMARY"
