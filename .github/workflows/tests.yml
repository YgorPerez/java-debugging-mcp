name: tests

# Two layers, both gating:
#   - unit tests (fast, no JVM)
#   - MCP-level integration tests: the real `jdwp-mcp` binary driven over JSON-RPC against probe JVMs
#     that the harness compiles, launches and reaps itself (mcp-server/tests/mcp_integration.rs).
#
# The integration tests need a JDK — WITHOUT one they print `SKIP` and pass, which would make this job
# green while testing nothing. That is why a JDK is installed explicitly and why the step below fails
# the build if it sees a SKIP line.

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release.yml can gate a tag on this suite. A tag ref matches neither trigger above, so
  # without this the release would be relying on a run that happened on a different ref (REL-1, #34).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # javac is required, not just a JRE: the harness compiles examples/probes/*.java at test time.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unit tests
        run: cargo test

      # Scoped to --test mcp_integration on purpose: a bare `cargo test -- --ignored` also un-ignores
      # jdwp-client's illustrative ```ignore doctests, which were never meant to compile.
      #
      # `shell: bash` is load-bearing, not decoration. A `run:` step without it gets `bash -e` and NO
      # pipefail, so in `script | tee log` the pipeline's status is TEE's — and a failing test suite
      # exited 1 into a tee that exited 0, leaving this step green. The SKIP grep below would not have
      # caught it either: that looks for skips, not failures. Naming the shell turns on pipefail.
      - name: Integration tests
        shell: bash
        run: scripts/integration-test.sh 2>&1 | tee integration.log

      - name: Fail if any integration test was skipped
        run: |
          if grep -q 'SKIP .*no JDK found' integration.log; then
            echo "::error::Integration tests skipped (no JDK found) — this job would be green without testing anything:"
            grep 'SKIP .*no JDK found' integration.log
            exit 1
          fi
