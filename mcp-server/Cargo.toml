[package]
name = "jdwp-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The library is the request→reply path; the binary is the stdio adapter over it (CLEAN-3, #186).
#
# `name` is the crate name imports use and it is unchanged from what cargo would have defaulted to —
# spelled out because the binary next to it differs by a hyphen and that has caught people out
# elsewhere in this workspace (`cargo clean -p jdwp-client` cleans nothing and exits 0).
#
# **This library is not a supported API.** See `src/lib.rs`'s crate docs: the supported surface is the
# MCP tool set, everything exported here is `#[doc(hidden)]`, and `cargo-semver-checks` now reads two
# packages rather than one (`scripts/semver-check.sh`).
[lib]
name = "jdwp_mcp"
path = "src/lib.rs"

[[bin]]
name = "jdwp-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Through the workspace table now, like every other dependency here, because publishing needs this one to
# carry a version as well as a path — see the comment on the entry in the root Cargo.toml.
jdwp-client.workspace = true
schemars = "1"

[dev-dependencies]
tempfile = "3.8"
