[workspace]
members = ["mcp-server", "jdwp-client"]
# `fuzz/` is its own workspace on purpose (TEST-45, #153): cargo-fuzz needs nightly, and keeping it
# out of this graph is what stops a nightly toolchain reaching the crates the gate builds.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.19.0"
edition = "2021"
# MEASURED, not declared (BUILD-2, #142). "1.82" sat here untested and was false in both directions
# that matter: the workspace has never built on it. Two separate floors, found by running each toolchain:
#
#   1.82  fails on OUR code   -- mcp-server/src/session.rs, `pub const fn watch_mut(&mut self)`,
#                               three E0658; `const_mut_refs` stabilised in 1.83.
#   1.83  builds lib and bin, fails `--all-targets` -- tempfile -> getrandom 0.4.3 needs edition2024,
#   1.84  same                                         which Cargo gained in 1.85. Fails at RESOLUTION,
#                                                      before any of our code is compiled.
#   1.85  builds everything.
#
# 1.85 is one honest number rather than 1.83 plus a documented dev floor. Two numbers that must move
# together is the duplicated fact DOC-15 (#145) is about, and a contributor who clones this and runs
# `cargo test` needs 1.85 whatever the library alone would tolerate.
#
# The `msrv` job in tests.yml reads this line and builds on it, so the claim is checked rather than
# asserted. Raising it here raises what CI tests, in one place.
rust-version = "1.85"
# Ed Sweeney is the original author of the upstream this was forked from
# (navicore/jdwp-mcp, the first 22 commits); LICENSE keeps his copyright notice.
authors = ["Ygor Perez <ygor@infotera.com.br>", "Ed Sweeney <ed@onextent.com>"]
license = "MIT"
repository = "https://github.com/YgorPerez/java-debugging-mcp"
description = "MCP server for Java debugging via JDWP protocol"
readme = "README.md"
keywords = ["mcp", "jdwp", "java", "debugger", "llm"]
categories = ["development-tools::debugging", "command-line-utilities"]

# NOTE: the clippy lint policy lives as crate-root `#![warn(...)]`/`#![allow(...)]`
# attributes in `jdwp-client/src/lib.rs` and `mcp-server/src/main.rs`, not here.
# The CI health gate (rust-doctor) passes its clippy lint flags on the command
# line, which a Cargo `[lints]` table cannot override; only source-level crate
# attributes can. Keeping the policy in one place (the crate roots) avoids a
# manifest table that silently fails to apply under the gate.

[workspace.dependencies]
# The intra-workspace dependency, and the ONE entry here whose version is not a floor but an exact
# statement about a sibling crate in this tree.
#
# `path` is what every local build resolves through; `version` exists solely because `cargo publish`
# refuses a package whose dependency is a bare path — it has to name something a consumer downloading
# `jdwp-mcp` from crates.io can also download. Cargo uses `path` locally and rewrites the published
# manifest to the `version` alone, so the two never both apply.
#
# `package` carries the crates.io rename (see jdwp-client/Cargo.toml for why the obvious name was
# unavailable). Keeping the KEY as `jdwp-client` is what lets `mcp-server` go on saying
# `jdwp-client.workspace = true`.
#
# **This version must equal [workspace.package].version above, and `scripts/release.sh` bumps both in one
# step.** A `^0.x` requirement matches only its own minor, so leaving this behind while the workspace moves
# on makes the requirement unsatisfiable by the very crate it points at.
#
# MEASURED, because the obvious guess about this is wrong and was briefly written down as fact: cargo
# validates a path dependency's `version` against the path package at RESOLUTION, so the mismatch is not
# some subtle thing that survives to the registry. Planting `version = "0.18.0"` here fails the next
# `cargo check` outright:
#
#     error: failed to select a version for the requirement `java-debugging-jdwp-client = "^0.18.0"`
#     candidate versions found which didn't match: 0.19.0
#
# So this needs no test pinning it and no warning beside it. It is load-bearing for `release.sh` — whose
# `cargo update` step would fail on a half-done bump — and inert for everyone else.
jdwp-client = { package = "java-debugging-jdwp-client", path = "jdwp-client", version = "0.19.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.0"
