# Per-crate, not at the workspace root, and that is deliberate — see mcp-server/clippy.toml for the twin.
#
# `schemars` pulls `syn 3` while `serde_derive` pulls `syn 2`. Both are needed, so the duplication is not
# resolvable; it costs build time, not correctness. Declared as an explicit allowance rather than tolerated,
# because the doctor gate fails on warnings now (LINT-1, #18) and a known-accepted finding must not become
# the reason to turn the gate off. Listing `syn` by name keeps the NEXT duplicate — which would be a real
# finding — failing the build instead of hiding behind this one.
#
# Why per-crate: a workspace-root clippy.toml works for `cargo clippy` (which walks up from
# CARGO_MANIFEST_DIR) but NOT for rust-doctor's invocation, which is the actual gate. CI reported the lint
# against `<crate>/clippy.toml:1` — the path clippy looked in and did not find. Keep the two files in sync.
allowed-duplicate-crates = ["syn"]
allow-panic-in-tests = true
